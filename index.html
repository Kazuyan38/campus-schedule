<style>
  :root{
    --bg:#07080c; --bg-2:#0c0e15;
    --panel:rgba(255,255,255,.035); --panel-2:rgba(255,255,255,.065); --panel-solid:#10121a;
    --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.14);
    --fg:#eceef6; --mute:#9097ab; --dim:#5b6174;
    --accent:#8b7cff; --accent-2:#3de0d0; --warn:#ffb547; --danger:#ff5d73;
    --radius:16px; --radius-s:10px;
    --font: "Inter","SF Pro Display",system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
    --mono: "SF Mono","JetBrains Mono","Cascadia Mono",ui-monospace,Menlo,Consolas,monospace;
    --bar-h: 76px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;text-size-adjust:100%}
  body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
  body.lock{overflow:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(60vmax 45vmax at 8% -8%, rgba(139,124,255,.20), transparent 60%),
      radial-gradient(50vmax 40vmax at 105% 110%, rgba(61,224,208,.13), transparent 60%),
      radial-gradient(40vmax 30vmax at 80% 10%, rgba(255,93,160,.06), transparent 60%),
      var(--bg)}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%)}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none;padding:0}
  .ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  .wrap{max-width:1120px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}

  /* ---------- header ---------- */
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:max(18px,env(safe-area-inset-top));padding-bottom:14px}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.32em;color:var(--mute);text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 10px var(--accent-2)}
  h1{margin:6px 0 0;font-size:clamp(26px,6vw,38px);font-weight:750;letter-spacing:-.02em;line-height:1;display:flex;align-items:baseline;gap:12px}
  h1 .qbig{font-family:var(--mono);font-weight:600;font-size:.62em;letter-spacing:.02em;
    background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .actions{display:flex;gap:8px}
  .iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--fg);transition:background .2s,border-color .2s,transform .15s}
  .iconbtn:hover{background:var(--panel-2);border-color:var(--line-2)}
  .iconbtn:active{transform:scale(.94)}

  /* ---------- quarter tabs ---------- */
  .qtabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);padding:4px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .qtabs .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);border-radius:10px;
    background:linear-gradient(135deg,rgba(139,124,255,.28),rgba(61,224,208,.16));border:1px solid rgba(139,124,255,.45);
    box-shadow:0 0 24px -6px rgba(139,124,255,.6), inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .38s cubic-bezier(.2,.9,.25,1)}
  .qtab{position:relative;z-index:1;height:42px;border-radius:10px;font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.06em;color:var(--mute);transition:color .25s;display:flex;align-items:center;justify-content:center;gap:6px}
  .qtab.on{color:var(--fg)}
  .qtab .cur{width:5px;height:5px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 8px var(--accent-2)}
  .qtab .cnt{font-size:10px;color:var(--dim);font-weight:500}
  .qtab.on .cnt{color:var(--mute)}

  /* ---------- now card ---------- */
  #now{margin:14px 0 0}
  .nowcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer;width:100%;text-align:left;transition:border-color .2s}
  .nowcard:hover{border-color:var(--line-2)}
  .nowcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--accent));box-shadow:0 0 18px var(--c,var(--accent))}
  .nowcard.idle{cursor:default}
  .nowcard .when{flex:none;min-width:74px}
  .nowcard .lab{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--mute);display:flex;align-items:center;gap:6px;text-transform:uppercase}
  .nowcard .lab i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 8px var(--c,var(--accent))}
  .nowcard.live .lab i{animation:pulse 1.6s ease-in-out infinite}
  .nowcard .big{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
  .nowcard .what{min-width:0;flex:1}
  .nowcard .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nowcard .sub{font-size:12.5px;color:var(--mute);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
  .nowcard .sub span{display:inline-flex;align-items:center;gap:4px}
  .nowcard .sub .ic{width:13px;height:13px}
  .nowcard .rem{flex:none;font-family:var(--mono);font-size:11px;color:var(--mute);text-align:right}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

  main{padding:16px 0 calc(var(--bar-h) + 40px + env(safe-area-inset-bottom))}

  /* ---------- timetable grid ---------- */
  .tt{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:5px}
  .dh{text-align:center;padding:6px 0 8px;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.08em;position:relative}
  .dh small{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.18em;margin-top:2px;font-weight:500}
  .dh.today{color:var(--fg)}
  .dh.today::after{content:"";position:absolute;left:50%;bottom:0;width:18px;height:2px;margin-left:-9px;border-radius:2px;background:var(--accent-2);box-shadow:0 0 10px var(--accent-2)}
  .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:var(--radius-s);min-height:92px}
  .ph b{font-family:var(--mono);font-size:18px;font-weight:600;line-height:1}
  .ph span{font-family:var(--mono);font-size:9px;color:var(--dim);line-height:1.25;text-align:center}
  .ph.now b{color:var(--accent-2);text-shadow:0 0 12px rgba(61,224,208,.7)}
  .cell{min-height:92px;border-radius:var(--radius-s);background:rgba(255,255,255,.018);border:1px dashed rgba(255,255,255,.06);display:flex;flex-direction:column;gap:4px;padding:3px;position:relative;min-width:0}
  .cell.todaycol{background:rgba(61,224,208,.035)}
  .cell.empty{align-items:center;justify-content:center;color:transparent;transition:color .2s,background .2s,border-color .2s}
  .cell.empty .ic{width:18px;height:18px}
  .cell.empty:hover{color:var(--mute);background:rgba(255,255,255,.04);border-color:var(--line-2)}
  @media (hover:none){.cell.empty{color:rgba(255,255,255,.08)}}
  .cell.filled{border-style:solid;border-color:transparent;background:none;padding:0}
  .cell.now{box-shadow:0 0 0 1.5px var(--accent-2),0 0 22px -4px rgba(61,224,208,.6)}
  .chip{flex:1;min-height:0;width:100%;text-align:left;border-radius:var(--radius-s);padding:8px 7px;display:flex;flex-direction:column;gap:4px;
    background:linear-gradient(165deg,var(--c1),var(--c2));border:1px solid var(--c3);position:relative;overflow:hidden;
    box-shadow:0 10px 26px -16px var(--c),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .15s,box-shadow .2s}
  .chip::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:0 2px 2px 0;background:var(--c);box-shadow:0 0 10px var(--c)}
  .chip:hover{box-shadow:0 12px 30px -12px var(--c),inset 0 1px 0 rgba(255,255,255,.1)}
  .chip:active{transform:scale(.97)}
  .chip .n{font-size:11px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
  .chip .r{font-size:9.5px;color:var(--mute);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto}
  .chip .t{display:none;font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.dup .n{-webkit-line-clamp:1}
  .chip .dupb{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .lunch{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--dim);padding:4px 2px}
  .lunch::before,.lunch::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line-2),transparent)}

  @media (min-width:720px){
    .tt{grid-template-columns:70px repeat(5,minmax(0,1fr));gap:8px}
    .ph,.cell{min-height:112px}
    .ph span{font-size:10.5px}
    .chip{padding:12px 12px;gap:6px}
    .chip .n{font-size:13.5px}
    .chip .r{font-size:11.5px}
    .chip .t{display:block}
    .dh{font-size:13px}
  }

  /* ---------- list view ---------- */
  .list{display:grid;grid-template-columns:1fr;gap:12px}
  @media (min-width:760px){.list{grid-template-columns:1fr 1fr}}
  .card{position:relative;text-align:left;width:100%;border-radius:var(--radius);padding:16px 16px 16px 20px;background:var(--panel);border:1px solid var(--line);overflow:hidden;transition:border-color .2s,transform .15s;display:flex;flex-direction:column;gap:12px}
  .card:hover{border-color:var(--line-2)}
  .card:active{transform:scale(.99)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);box-shadow:0 0 16px var(--c)}
  .card::after{content:"";position:absolute;right:-60px;top:-60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--c2),transparent 70%);pointer-events:none}
  .card h3{margin:0;font-size:16.5px;font-weight:750;letter-spacing:-.01em;line-height:1.35}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--fg);white-space:nowrap}
  .tag.c{background:var(--c2);border-color:var(--c3)}
  .tag.q{color:var(--mute)}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
  .mi{display:flex;gap:8px;align-items:flex-start;font-size:13px;min-width:0}
  .mi .ic{width:15px;height:15px;color:var(--dim);margin-top:2px}
  .mi .k{font-size:10px;color:var(--dim);letter-spacing:.12em;font-family:var(--mono);display:block;margin-bottom:1px}
  .mi .v{word-break:break-word;white-space:pre-wrap;line-height:1.45}
  .mi.full{grid-column:1/-1}
  .v.none{color:var(--dim)}

  .ebar{display:flex;height:8px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.05);gap:2px}
  .ebar i{display:block;height:100%}
  .elegend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px}
  .elegend span{display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
  .elegend b{font-family:var(--mono);font-weight:600}
  .elegend i{width:8px;height:8px;border-radius:2px;flex:none}
  .enote{font-size:12.5px;color:var(--mute);margin-top:8px;white-space:pre-wrap;line-height:1.55}

  .empty-state{padding:56px 20px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--radius);color:var(--mute)}
  .empty-state b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}
  .empty-state p{margin:0 0 18px;font-size:13px;line-height:1.7}

  /* ---------- bottom bar ---------- */
  .bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;
    width:min(520px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr) auto;gap:4px;align-items:center;padding:6px;border-radius:22px;
    background:rgba(16,18,26,.72);border:1px solid var(--line-2);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}
  .bar .seg{height:52px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;letter-spacing:.04em;font-weight:600;color:var(--mute);transition:color .2s,background .2s}
  .bar .seg.on{color:var(--fg);background:rgba(255,255,255,.07)}
  .bar .add{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,var(--accent),#5b8cff 55%,var(--accent-2));box-shadow:0 8px 28px -6px rgba(139,124,255,.8),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s}
  .bar .add:active{transform:scale(.92)}
  .bar .add .ic{width:24px;height:24px;stroke-width:2.2}

  /* ---------- sheet ---------- */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(3,4,8,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .28s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#141722,#0d0f16);border:1px solid var(--line-2);border-bottom:none;border-radius:22px 22px 0 0;
    box-shadow:0 -30px 80px -30px rgba(0,0,0,.9);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.25,1);visibility:hidden}
  .sheet.open{transform:none;visibility:visible}
  .sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:10px auto 0;flex:none}
  @media (min-width:720px){
    .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(640px,calc(100% - 48px));max-height:86vh;border-radius:22px;border-bottom:1px solid var(--line-2);
      transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.25,1),opacity .25s}
    .sheet.open{transform:translate(-50%,-50%);opacity:1}
    .sheet .grab{display:none}
  }
  .sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 10px;flex:none}
  .sh-head h2{margin:0;font-size:17px;font-weight:700}
  .sh-body{padding:4px 20px 20px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1}
  .sh-foot{display:flex;gap:10px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none;background:rgba(10,12,18,.6)}
  .sh-foot .spacer{flex:1}
  .btn{height:48px;padding:0 20px;border-radius:13px;font-weight:650;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel-2);border:1px solid var(--line-2);transition:background .2s,transform .12s,border-color .2s}
  .btn:hover{background:rgba(255,255,255,.1)}
  .btn:active{transform:scale(.97)}
  .btn.pri{background:linear-gradient(135deg,var(--accent),#5b8cff);border-color:transparent;color:#fff;box-shadow:0 8px 24px -10px rgba(139,124,255,.9)}
  .btn.danger{color:var(--danger);border-color:rgba(255,93,115,.35);background:rgba(255,93,115,.08)}
  .btn.danger.armed{background:var(--danger);color:#fff;border-color:transparent}
  .btn.wide{flex:1}
  .btn .ic{width:17px;height:17px}

  /* ---------- form ---------- */
  .fg{margin-top:18px}
  .fg>label,.fl{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--mute);margin-bottom:8px;text-transform:uppercase}
  .fl .req{color:var(--accent-2)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row2 .fg{margin-top:18px}
  input[type=text],input[type=url],input[type=number],input[type=date],input[type=time],textarea{width:100%;font-size:16px;padding:12px 13px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line-2);outline:none;transition:border-color .2s,box-shadow .2s,background .2s;color-scheme:dark}
  textarea{resize:vertical;min-height:76px;line-height:1.5}
  input:focus,textarea:focus{border-color:rgba(139,124,255,.7);box-shadow:0 0 0 3px rgba(139,124,255,.18);background:rgba(255,255,255,.06)}
  input.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(255,93,115,.18)}
  ::placeholder{color:var(--dim)}
  .toggles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tg{height:44px;border-radius:11px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);font-family:var(--mono);font-weight:600;font-size:13.5px;color:var(--mute);transition:all .18s}
  .tg.on{color:#fff;background:linear-gradient(135deg,rgba(139,124,255,.45),rgba(91,140,255,.3));border-color:rgba(139,124,255,.8);box-shadow:0 0 18px -6px rgba(139,124,255,.8)}
  .slots{display:grid;grid-template-columns:30px repeat(5,1fr);gap:5px}
  .slots .sh{font-size:11px;color:var(--mute);text-align:center;padding-bottom:2px}
  .slots .sp{font-family:var(--mono);font-size:12px;color:var(--mute);display:grid;place-items:center}
  .slot{height:40px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.025);transition:all .15s;position:relative}
  .slot.on{background:linear-gradient(135deg,rgba(61,224,208,.4),rgba(139,124,255,.35));border-color:rgba(61,224,208,.8);box-shadow:0 0 14px -4px rgba(61,224,208,.8)}
  .slot.on::after{content:"";position:absolute;inset:0;margin:auto;width:8px;height:8px;border-radius:50%;background:#fff}
  .slot.busy:not(.on)::before{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--dim)}
  .hint{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.6}
  .hint.warn{color:var(--warn)}
  .erow{display:grid;grid-template-columns:1fr 92px 40px;gap:8px;margin-bottom:8px;align-items:center}
  .erow .pct{position:relative}
  .erow .pct input{padding-right:26px;text-align:right}
  .erow .pct::after{content:"%";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:13px;pointer-events:none}
  .erow .x{height:44px;border-radius:10px;display:grid;place-items:center;color:var(--dim)}
  .erow .x:hover{color:var(--danger);background:rgba(255,93,115,.08)}
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .pre{font-size:12.5px;padding:7px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--mute);background:rgba(255,255,255,.03)}
  .pre:hover{color:var(--fg);border-color:rgba(139,124,255,.6)}
  .etotal{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mute);margin-top:4px}
  .etotal b{font-family:var(--mono);font-size:14px;color:var(--fg)}
  .etotal b.bad{color:var(--warn)}
  .etotal b.ok{color:var(--accent-2)}
  .linkbtn{font-size:13px;color:var(--accent);padding:8px 0;font-weight:600}
  .swatches{display:flex;flex-wrap:wrap;gap:10px}
  .sw{width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:0 0 14px -3px var(--c);border:2px solid transparent;outline:2px solid transparent;outline-offset:2px;transition:outline-color .15s,transform .15s}
  .sw.on{outline-color:#fff;transform:scale(1.06)}

  /* ---------- detail ---------- */
  .dt-hero{position:relative;border-radius:var(--radius);padding:18px;background:linear-gradient(150deg,var(--c1),var(--c2) 70%);border:1px solid var(--c3);overflow:hidden}
  .dt-hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--c1),transparent 70%)}
  .dt-hero h3{margin:0 0 12px;font-size:21px;line-height:1.3;letter-spacing:-.01em;font-weight:780;position:relative;z-index:1}
  .dt-hero .tags{position:relative;z-index:1}
  .dsec{margin-top:18px;padding:16px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line)}
  .dsec h4{margin:0 0 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--mute);font-weight:500;display:flex;align-items:center;gap:8px;text-transform:uppercase}
  .dsec h4 .ic{width:14px;height:14px}
  .dsec .body{font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .dsec a{color:var(--accent-2);word-break:break-all}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .dgrid .dsec{margin-top:0}
  .dgrid .dsec .body{font-size:15px;font-weight:600}
  .dgrid .full{grid-column:1/-1}

  /* ---------- share/settings ---------- */
  .sharebox{display:flex;gap:8px}
  .sharebox input{font-family:var(--mono);font-size:12.5px}
  .stack{display:flex;flex-direction:column;gap:10px}
  .qrange{display:grid;grid-template-columns:26px minmax(0,1fr) 10px minmax(0,1fr);gap:6px;align-items:center;margin-bottom:10px}
  .qrange b{font-family:var(--mono);font-size:13px;color:var(--mute)}
  .qrange span{color:var(--dim);text-align:center}
  .qrange input{min-width:0;width:100%;height:44px;padding:0 8px;font-size:14px;-webkit-appearance:none;appearance:none}
  .divider{height:1px;background:var(--line);margin:22px 0 4px}
  .about{font-size:12px;color:var(--dim);line-height:1.8;margin-top:18px}

  /* ---------- year tabs ---------- */
  #tabs{display:flex;flex-direction:column;gap:8px}
  #tabs.hide{display:none}
  .qtabs.hide{display:none}
  .ytabs{grid-template-columns:repeat(var(--n),1fr)}
  .ytabs .ind{width:calc((100% - 8px)/var(--n))}
  .ytabs .qtab{height:48px;flex-direction:column;gap:2px;font-family:var(--font);font-size:14px;letter-spacing:.02em}
  .ytabs .qtab small{font-family:var(--mono);font-size:9.5px;color:var(--dim);font-weight:500;letter-spacing:.08em;display:flex;align-items:center;gap:5px}
  .ytabs .qtab.on small{color:var(--mute)}

  /* ---------- list filters / rows ---------- */
  .filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  .fchip{height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;font-weight:600;color:var(--mute);background:rgba(255,255,255,.03);transition:all .18s}
  .fchip.on{color:#fff;background:rgba(139,124,255,.22);border-color:rgba(139,124,255,.7);box-shadow:0 0 16px -6px rgba(139,124,255,.8)}
  .search{flex:1 1 200px;min-width:0}
  .search input{height:40px;padding:8px 16px;border-radius:999px}
  .rows{display:flex;flex-direction:column;gap:6px}
  .row{display:grid;grid-template-columns:8px minmax(0,1fr) auto 44px;gap:12px;align-items:center;padding:12px 12px 12px 14px;border-radius:13px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%;transition:border-color .2s,background .2s}
  .row:hover{border-color:var(--line-2);background:var(--panel-2)}
  .row .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
  .rn{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rs{font-size:11.5px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rc{font-family:var(--mono);font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
  .rc small{font-size:10px;color:var(--dim);margin-left:2px;font-family:var(--font);font-weight:500}
  .gbadge{min-width:44px;height:32px;padding:0 6px;border-radius:9px;display:grid;place-items:center;font-weight:750;font-size:13.5px;border:1px solid;white-space:nowrap}
  .gbadge.pend{font-size:10.5px;font-weight:600;border-style:dashed}
  .ghead{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px;flex-wrap:wrap}
  .ghead:first-child{margin-top:4px}
  .ghead b{font-size:18px;font-weight:750;letter-spacing:-.01em}
  .ghead span{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em}
  .ghead em{font-style:normal;margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--mute)}

  /* ---------- toast ---------- */

    padding:11px 16px;border-radius:12px;background:rgba(22,25,36,.95);border:1px solid var(--line-2);font-size:13.5px;box-shadow:0 12px 30px -10px #000;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}

  .cblk{margin-bottom:12px;padding:8px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02)}

  .crow{grid-template-columns:minmax(0,1fr) 62px 38px;gap:6px}
  .crow input{padding:12px 10px}

  .crow .x{width:38px}

  /* ---------- phone (primary target) ---------- */
  @media (max-width:719px){
    .top{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:10px;align-items:center}
    .eyebrow{display:none}

    .ytabs .qtab{height:42px;flex-direction:row;gap:3px;font-size:13.5px}

    #now{margin-top:10px}

    .fchip{height:44px}
    .search input{height:44px}
    .linkbtn{padding:12px 0}
    .pre{padding:10px 13px}
    .sw{width:40px;height:40px}
    .gb{height:44px}
    .tg{height:46px}
    .slot{height:44px}
    .alog button{width:44px;height:38px}
    .tk .x{width:44px;height:44px}
    .tk.x5{grid-template-columns:44px minmax(0,1fr) auto 44px}
    .iconbtn,.btn{min-height:44px}
    .hint{font-size:12.5px}
    .fl,.fg>label{font-size:11px}
    .rs{font-size:12px}
    .tag{font-size:11.5px}
    .sh-body{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  }

</style>
</head>

<script>
/* ===== 設定 ===== */

const CURRICULUM = [

];
function presetCats() {
  const out = [];
  CURRICULUM.forEach((t, i) => {
    out.push({ id: 'p' + i, name: t.name, req: t.req, parent: '' });

};

const LATE_RATIOS = [3, 2, 0];      // 遅刻 n 回で欠席1回（0 = 数えない）
const STORE_KEY = 'campus-schedule/v1';
const EXAM_KINDS = ['期末試験', '中間試験', '小テスト', 'レポート', '課題', 'その他'];
const EXAM_HOURS = { 期末試験: 10, 中間試験: 6, 小テスト: 2, レポート: 6, 課題: 3, その他: 4 };   // 目標勉強時間の既定値（時間）
const STUDY_STEPS = [15, 30, 60];   // 勉強時間のワンタップ記録（分）

const REVIEW_SHARE = 0.2;           // 自動計画で前日の総復習に回す時間の割合

/* ===== util ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmtT = t => t.replace(/^0/, '');
const isUrl = u => /^https?:\/\/\S+$/i.test(u);
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

function rgba(hex, a) {

}

  cap: '<svg class="ic" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5M22 9v6"/></svg>',

let state = load();
let search = '';

/* ===== years / grades ===== */
function yearsList() {
  const { entryYear, years } = state.settings;
  const set = new Set(Array.from({ length: years }, (_, i) => entryYear + i));
  state.courses.forEach(c => set.add(c.year));

}

}
function gradeMeta(code) {

/* ===== attendance ===== */
// 月日だけで持つクォーター期間を、その授業の年度の実日付に写す（4月以降は当年、1〜3月は翌年）
function rangeDate(year, iso) {
  const [m, d] = iso.slice(5).split('-').map(Number);
  return new Date(m >= ACAD_START_MONTH ? year : year + 1, m - 1, d);
}

  if (!c.slots.length) return null;
  const rs = state.settings.ranges;
  if (c.quarters.every(q => rs[q - 1].s && rs[q - 1].e)) {
    let n = 0;
    for (const q of c.quarters) {
      const a = rangeDate(c.year, rs[q - 1].s), b = rangeDate(c.year, rs[q - 1].e);
      if (b < a) b.setFullYear(b.getFullYear() + 1);
      for (const dt = new Date(a); dt <= b; dt.setDate(dt.getDate() + 1)) {
        n += c.slots.filter(s => s.d === dt.getDay() - 1).length;
      }
    }

}

/* ===== quarter / time ===== */
function quarterByDate(date = new Date()) {
  const t = isoDate(date).slice(5);
  for (let i = 0; i < 4; i++) {
    const { s, e } = state.settings.ranges[i];

  }

const coursesOfYear = y => state.courses.filter(c => c.year === y);

    if (d < 0 || d > 4) continue;
    for (const P of PERIODS) {
      const s = toMin(P.s), e = toMin(P.e);
      if (off === 0 && e <= mins) continue;
      const cs = coursesAt(y, q, d, P.n);
      if (!cs.length) continue;

      off.map(c => `<button class="offchip" data-open="${esc(c.id)}" style="${cvars(c.color)}">${esc(c.name)}<small>${[c.room, c.credits && c.credits + '単位'].filter(Boolean).map(esc).join(' · ') || '—'}</small></button>`).join('') + '</div></div>';
  }
  return h;
}

/* ----- 1日表示 / 週間切替 ----- */
const fmtShort = iso => `${+iso.slice(5, 7)}/${+iso.slice(8)}`;
// 今週の月〜金の日付。土日は来週として扱う
function weekDate(i) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  if (t.getDay() === 6) t.setDate(t.getDate() + 2); else if (t.getDay() === 0) t.setDate(t.getDate() + 1);
  t.setDate(t.getDate() - (t.getDay() - 1) + i);
  return isoDate(t);
}
function vbarHTML() {
  const { span } = state.ui, today = isoDate(new Date());
  const seg = `<div class="seg2" role="group" aria-label="表示切替"><button data-span="week" class="${span === 'week' ? 'on' : ''}" aria-pressed="${span === 'week'}">週間</button><button data-span="day" class="${span === 'day' ? 'on' : ''}" aria-pressed="${span === 'day'}">1日</button></div>`;
  if (span === 'week') return `<div class="vbar">${seg}<span class="vdate num">${fmtShort(weekDate(0))} – ${fmtShort(weekDate(4))}</span></div>`;
  return `<div class="vbar">${seg}<div class="dchips">${DAYS.map((x, i) => {
    const dt = weekDate(i);
    return `<button class="dchip ${i === dayIdx ? 'on' : ''} ${dt === today ? 'today' : ''}" data-dd="${i}" aria-pressed="${i === dayIdx}"><b>${x}</b><small class="num">${+dt.slice(8)}</small></button>`;
  }).join('')}</div></div>`;
}
function dayHTML() {
  const { y, q } = state.ui, d = dayIdx, iso = weekDate(d), isToday = iso === isoDate(new Date()), nw = nowInfo();
  const n = PERIODS.reduce((a, P) => a + coursesAt(y, q, d, P.n).length, 0);
  let h = `<div class="dayhead fade-in"><b>${DAYS[d]}曜日</b><span class="num">${fmtShort(iso)}</span>${isToday ? '<em>TODAY</em>' : ''}<span class="sp"></span><span class="num">${n}コマ</span></div><div class="dlist fade-in">`;
  for (const P of PERIODS) {
    const cs = coursesAt(y, q, d, P.n);
    const live = isToday && nw.p === P.n, gone = isToday && toMin(P.e) <= nw.mins;
    h += `<div class="drow ${live ? 'now' : ''} ${gone ? 'gone' : ''}"><div class="dt"><b>${P.n}</b><span class="num">${fmtT(P.s)}<br>${fmtT(P.e)}</span></div><div class="dcs">` +
      (cs.length ? cs.map(c => {
        const ai = attInfo(c), warn = ai && ai.active && ai.level !== 'ok';
        const tags = (cs.length > 1 ? '<span class="tag" style="color:var(--warn)">時間割が重複</span>' : '') + (warn ? `<span class="tag num lv-${ai.level}">${attRestText(ai)}</span>` : '');
        return `<button class="dcard" data-open="${esc(c.id)}" style="${cvars(c.color)}"><span class="n">${esc(c.name)}</span>` +
          `<span class="m">${c.room ? `<span>${ICON.pin}${esc(c.room)}</span>` : ''}${c.teacher ? `<span>${ICON.user}${esc(c.teacher)}</span>` : ''}${c.credits ? `<span class="num">${esc(c.credits)}単位</span>` : ''}</span>${tags ? `<span class="tags">${tags}</span>` : ''}</button>`;
      }).join('') : `<button class="dempty" data-add="${d}-${P.n}">${ICON.plus}空きコマ</button>`) + '</div></div>';
    if (P.n === LUNCH_AFTER) h += `<div class="lunch num">LUNCH ${fmtT(PERIODS[LUNCH_AFTER - 1].e)} – ${fmtT(PERIODS[LUNCH_AFTER].s)}</div>`;
  }
  h += '</div>';
  const exs = state.exams.filter(x => x.date === iso).sort(byExamDate);
  const tks = isToday ? todayTasks() : dayTasks(iso);
  if (exs.length || tks.length) {
    h += `<div class="sec"><h3>${isToday ? '今日' : fmtDate(iso)}の試験・勉強</h3>` +
      (exs.length ? `<div class="rows" style="margin-bottom:10px">${exs.map(x => examRowHTML(x)).join('')}</div>` : '') +
      (tks.length ? `<div class="tks">${tks.map(({ ex, t }) => taskRowHTML(ex, t, false)).join('')}</div>` : '') + '</div>';
  }
  const off = coursesIn(y, q).filter(c => !c.slots.length && c.grade !== 'W');
  if (off.length) h += `<div class="offgrid"><span class="fl" style="margin:0">時間割外（集中講義・オンデマンドなど）</span><div class="offchips">` +
    off.map(c => `<button class="offchip" data-open="${esc(c.id)}" style="${cvars(c.color)}">${esc(c.name)}<small>${[c.room, c.credits && c.credits + '単位'].filter(Boolean).map(esc).join(' · ') || '—'}</small></button>`).join('') + '</div></div>';
  return h;
}
const timetableHTML = (anim = true) => vbarHTML() + (state.ui.span === 'day' ? dayHTML() : gridHTML(state.ui.y, state.ui.q, anim));

function slotTags(c, extraCls = 'c') {
  return c.slots.map(s => `<span class="tag ${extraCls} num">${DAYS[s.d]}${s.p} · ${fmtT(PERIODS[s.p - 1].s)}–${fmtT(PERIODS[s.p - 1].e)}</span>`).join('');
}
function evalHTML(c) {
  if (!c.evals.length && !c.evalNote) return '<div class="v none">未入力</div>';
  const total = c.evals.reduce((a, x) => a + x.pct, 0);
  const denom = Math.max(total, 100);
  let h = '';
  if (c.evals.length) {
    h += `<div class="ebar">${c.evals.map((x, i) => `<i style="width:${(x.pct / denom) * 100}%;background:${EVAL_COLORS[i % EVAL_COLORS.length]}"></i>`).join('')}</div>`;
    h += `<div class="elegend">${c.evals.map((x, i) => `<span><i style="background:${EVAL_COLORS[i % EVAL_COLORS.length]}"></i>${esc(x.label || '（無題）')} <b class="num">${x.pct}%</b></span>`).join('')}</div>`;
  }
  if (c.evalNote) h += `<div class="enote">${esc(c.evalNote)}</div>`;
  return h;
}

/* ----- list ----- */
function listHTML() {
  const f = state.ui.filter;
  const chips = [['term', '今期'], ['year', 'この学年'], ['all', '4年間すべて']]
    .map(([k, l]) => `<button class="fchip ${f === k ? 'on' : ''}" data-filter="${k}">${l}</button>`).join('');
  const sb = f === 'all' ? `<div class="search"><input type="text" id="lsearch" placeholder="授業名・先生・区分で検索" value="${esc(search)}" enterkeyhint="search"></div>` : '';
  return `<div class="filters">${chips}${sb}</div><div id="lres">${listResultsHTML()}</div>`;
}
function listResultsHTML() {
  const { filter: f, y, q } = state.ui;
  if (f === 'term') return termCardsHTML(y, q);
  if (f === 'year') {
    const cs = coursesOfYear(y);
    if (!cs.length) return emptyHTML(`${yearLabel(y)}（${y}年度）の授業はまだありません`);
    let h = groupHead(yearLabel(y), `${y}年度`, cs);
    for (const qq of QUARTERS) {
      const g = cs.filter(c => (c.quarters[0] || 1) === qq).sort(byTime);
      if (!g.length) continue;
      h += `<div class="ghead"><b style="font-size:14px;font-family:var(--mono)">Q${qq}〜</b><span>${g.length} COURSES</span></div><div class="rows">${g.map(rowHTML).join('')}</div>`;
    }
    return `<div class="fade-in">${h}</div>`;
  }
  const s = search.trim().toLowerCase();
  const match = c => !s || [c.name, c.teacher, c.room, c.category, c.textbook, c.memo].some(v => v.toLowerCase().includes(s));
  let h = '';
  for (const yy of yearsList()) {
    const cs = coursesOfYear(yy).filter(match).sort(byTime);
    if (!cs.length) continue;
    h += groupHead(yearLabel(yy), `${yy}年度`, cs) + `<div class="rows">${cs.map(rowHTML).join('')}</div>`;
  }
  return h ? `<div class="fade-in">${h}</div>` : emptyHTML(s ? `「${esc(search)}」に一致する授業はありません` : 'まだ授業がありません');
}
function groupHead(title, sub, cs) {
  const st = stats(cs);
  return `<div class="ghead"><b>${esc(title)}</b><span>${esc(sub)}</span><em class="num">取得 ${fmtCr(st.earned)} · 予定 ${fmtCr(st.planned)} · GPA ${fmtGpa(st.gpa)}</em></div>`;
}
function rowHTML(c) {
  const where = c.slots.length ? c.slots.map(s => DAYS[s.d] + s.p).join(' ') : '時間割外';
  const sub = [c.quarters.map(q => 'Q' + q).join('·'), where, c.category, c.teacher].filter(Boolean).map(esc).join(' · ');
  const ai = attInfo(c);
  const attTxt = ai && ai.active && ai.level !== 'ok' ? `<span class="lv-${ai.level}" style="font-weight:700">${attRestText(ai)}</span> · ` : '';
  return `<button class="row" data-open="${esc(c.id)}" style="${cvars(c.color)}"><i class="dot"></i><div style="min-width:0"><div class="rn">${esc(c.name)}</div><div class="rs">${attTxt}${sub}</div></div><div class="rc">${c.credits ? esc(c.credits) + '<small>単位</small>' : '<small>—</small>'}</div>${gradeBadge(c)}</button>`;
}
function termCardsHTML(y, q) {
  const cs = coursesIn(y, q).sort(byTime);
  if (!cs.length) return emptyHTML(`${yearLabel(y)} Q${q} の授業はまだありません`, true);
  const mi = (icon, k, v, full) => `<div class="mi ${full ? 'full' : ''}">${icon}<div style="min-width:0"><span class="k">${k}</span><div class="v ${v ? '' : 'none'}">${v ? esc(v) : '—'}</div></div></div>`;
  const st = stats(cs);
  return `<div class="hint" style="margin:0 0 12px;font-family:var(--mono);letter-spacing:.12em">${yearLabel(y)} Q${q} · ${cs.length} COURSES · ${fmtCr(st.reg)} CREDITS</div>
  <div class="list fade-in">` + cs.map(c => `<button class="card" data-open="${esc(c.id)}" style="${cvars(c.color)}">
    <span class="gcorner">${gradeBadge(c)}</span>
    <div><h3>${esc(c.name)}</h3><div class="tags" style="margin-top:8px">${slotTags(c) || '<span class="tag q">時間割外</span>'}${c.credits ? `<span class="tag num">${esc(c.credits)}単位</span>` : ''}${c.category ? `<span class="tag q">${esc(c.category)}</span>` : ''}${(ai => ai && ai.active ? `<span class="tag num lv-${ai.level}">欠席 ${ai.used}/${ai.allowed}</span>` : '')(attInfo(c))}</div></div>
    <div class="meta">${mi(ICON.pin, 'ROOM', c.room)}${mi(ICON.user, 'TEACHER', c.teacher)}${mi(ICON.book, 'TEXTBOOK', c.textbook, true)}</div>
    <div class="mi full">${ICON.chart}<div style="min-width:0;flex:1"><span class="k">GRADING</span>${evalHTML(c)}</div></div>

function emptyHTML(msg, withAdd = true) {

}

/* ----- 卒業要件（区分別の最低取得単位） ----- */
const catPath = name => {
  const cs = state.settings.cats, k = cs.find(x => x.name === name), q = k && k.parent && cs.find(x => x.id === k.parent);
  return q ? `${q.name} › ${name}` : name;
};
function reqHTML() {
  const cs = state.settings.cats;
  if (!cs.length) return '';
  const GROUP_COLOR = '#aab2d5';
  let ci = 0;
  const tops = cs.filter(c => !c.parent);
  const nodes = tops.map(t => {
    const kids = cs.filter(k => k.parent === t.id).map(k => ({ k, color: COLORS[ci++ % COLORS.length], st: stats(state.courses.filter(c => c.category === k.name)) }));
    if (kids.length) return { t, kids, color: GROUP_COLOR, st: stats(state.courses.filter(c => kids.some(x => x.k.name === c.category))) };
    return { t, kids, color: COLORS[ci++ % COLORS.length], st: stats(state.courses.filter(c => c.category === t.name)) };
  });
  const leaves = new Set(nodes.flatMap(n => n.kids.length ? n.kids.map(x => x.k.name) : [n.t.name]));
  const orphan = stats(state.courses.filter(c => !leaves.has(c.category)));
  const sum = nodes.reduce((a, n) => a + n.t.req, 0);
  const total = sum || 1;
  const pc = (v, r) => r ? Math.min(100, v / r * 100) : 0;

  const seg = (label, req, st, color, big) => {
    const e = pc(st.earned, req), pl = Math.min(100 - e, pc(st.planned, req));
    const txt = big ? `<span><b>${esc(label)}</b><small class="num">${fmtCr(st.earned)} / ${fmtCr(req)}</small></span>` : req / total >= .06 ? `<span><small class="num">${fmtCr(req)}</small></span>` : '';
    return `<div class="seg" style="flex:${req};--c:${color}" title="${esc(label)}　取得 ${fmtCr(st.earned)} / 最低 ${fmtCr(req)}"><i class="e" style="width:${e}%"></i><i class="p" style="left:${e}%;width:${pl}%"></i>${txt}</div>`;
  };
  const top = nodes.filter(n => n.t.req > 0).map(n => seg(n.t.name, n.t.req, n.st, n.color, true)).join('');
  const sub = nodes.filter(n => n.t.req > 0).map(n => {
    const ks = n.kids.filter(x => x.k.req > 0);
    const rest = n.t.req - ks.reduce((a, x) => a + x.k.req, 0);
    return `<div class="slot2" style="flex:${n.t.req}">${ks.map(x => seg(x.k.name, x.k.req, x.st, x.color, false)).join('')}${rest > 0 && ks.length ? `<div style="flex:${rest}"></div>` : ''}</div>`;
  }).join('');

  const row = (name, req, st, color, kind) => {
    const need = Math.max(0, req - st.earned), covered = st.earned + st.planned >= req;
    const max = Math.max(req, st.earned + st.planned, 1);
    const right = !req ? `<b>${fmtCr(st.earned)}</b><small>取得</small>`
      : need ? `<b style="color:${covered ? 'var(--mute)' : 'var(--warn)'}">${fmtCr(need)}</b><small>あと</small>`
        : '<b style="color:var(--accent-2)">✓</b><small>達成</small>';
    return `<div class="yrow rq ${kind}" style="${cvars(color)}"><div><b>${esc(name)}</b><span class="ysub">${req ? '最低 ' + fmtCr(req) + '単位' : '最低単位の指定なし'}</span></div>` +
      `<div style="min-width:0"><div class="sbar"><i class="e" style="width:${st.earned / max * 100}%"></i><i class="p" style="width:${st.planned / max * 100}%"></i>${req ? `<span class="req" style="left:calc(${req / max * 100}% - 2px)"></span>` : ''}</div>` +
      `<div class="ymeta"><span>取得 ${fmtCr(st.earned)} / 予定 ${fmtCr(st.planned)}</span><span>${st.n}科目</span></div></div><div class="ynum">${right}</div></div>`;
  };
  const table = nodes.map(n => n.kids.length
    ? `<div class="rq-g">${row(n.t.name, n.t.req, n.st, n.color, 'grp')}<div class="rq-kids">${n.kids.map(x => row(x.k.name, x.k.req, x.st, x.color, 'sub')).join('')}</div></div>`
    : row(n.t.name, n.t.req, n.st, n.color, 'top')).join('');

  const eq = nodes.filter(n => n.t.req > 0).map(n => `${esc(n.t.name)} ${fmtCr(n.t.req)}`).join(' ＋ ');
  const mismatch = sum && sum !== state.settings.required ? `<div class="hint warn">区分の合計（${fmtCr(sum)}単位）が、設定の卒業要件（${fmtCr(state.settings.required)}単位）と一致していません。</div>` : '';
  const kidMismatch = nodes.filter(n => n.kids.length && n.kids.reduce((x, k) => x + k.k.req, 0) !== n.t.req)
    .map(n => `<div class="hint warn">${esc(n.t.name)}の小区分の合計（${fmtCr(n.kids.reduce((x, k) => x + k.k.req, 0))}単位）が、${esc(n.t.name)}の ${fmtCr(n.t.req)}単位と一致していません。</div>`).join('');
  return `<div class="sec"><h3>卒業要件の内訳 <small>区分ごとの最低取得単位</small></h3>
    <div class="rq-eq num">卒業要件 <b>${fmtCr(state.settings.required)}</b> 単位 ＝ ${eq}</div>
    <div class="ice" role="img" aria-label="卒業要件の区分別の達成状況"><div class="ice-row">${top}</div><div class="ice-row sub">${sub}</div></div>
    <div class="ytable">${table}</div>
    ${orphan.n ? `<div class="hint warn" style="margin-top:10px">区分を設定していない授業が ${orphan.n} 科目（${fmtCr(orphan.reg)}単位）あります。要件に数えられないので、授業の編集で科目区分を選んでください。</div>` : ''}
    ${mismatch}${kidMismatch}
    <div class="legend-mini"><span><i style="background:var(--warn)"></i>あと＝予定を含めても不足</span><span><i style="background:var(--mute)"></i>あと＝履修予定で充足見込み</span><span><i style="background:var(--accent-2)"></i>✓＝達成</span></div></div>`;
}

/* ----- stats ----- */
function statsHTML() {
  const all = state.courses;
  const st = stats(all);
  const req = state.settings.required;
  const remain = Math.max(0, req - st.earned);
  const short = Math.max(0, req - st.earned - st.planned);
  const R = 70, C = 2 * Math.PI * R;
  const ef = Math.min(1, st.earned / req), pf = Math.min(1 - ef, st.planned / req);
  let h = '';
  if (!state.settings.entrySet) {
    h += `<div class="banner">${ICON.cap}<div>入学年度が未設定です。いまは <b>${state.settings.entryYear}年度入学</b> として学年を表示しています。</div><button class="btn" id="goSettings">設定する</button></div>`;
  }
  h += `<div class="hero fade-in">
    <div class="ring"><svg viewBox="0 0 176 176">
      <circle cx="88" cy="88" r="${R}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="14"/>
      <circle cx="88" cy="88" r="${R}" fill="none" stroke="rgba(139,124,255,.55)" stroke-width="14" stroke-dasharray="${pf * C} ${C}" stroke-dashoffset="${-ef * C}"/>
      <circle cx="88" cy="88" r="${R}" fill="none" stroke="#3de0d0" stroke-width="14" stroke-linecap="${ef > 0 ? 'round' : 'butt'}" stroke-dasharray="${ef * C} ${C}" style="filter:drop-shadow(0 0 6px rgba(61,224,208,.7))"/>
    </svg><div class="ctr"><b class="num">${fmtCr(st.earned)}</b><span>/ ${fmtCr(req)} CREDITS</span><em>${Math.round(ef * 100)}% 取得</em></div></div>
    <div class="tiles">
      <div class="tile"><div class="k"><i style="background:#3de0d0"></i>取得単位</div><div class="v num">${fmtCr(st.earned)}<small>単位</small></div><div class="d">卒業まであと ${fmtCr(remain)}</div></div>
      <div class="tile"><div class="k"><i style="background:rgba(139,124,255,.85)"></i>取得予定</div><div class="v num">${fmtCr(st.planned)}<small>単位</small></div><div class="d">履修中・成績未入力</div></div>
      <div class="tile"><div class="k"><i style="background:linear-gradient(135deg,#8b7cff,#3de0d0)"></i>通算 GPA</div><div class="v num">${fmtGpa(st.gpa)}</div><div class="d">${SCALES[state.settings.scale].labels[0]}=4 〜 ${SCALES[state.settings.scale].labels[4]}=0</div></div>
      <div class="tile"><div class="k"><i style="background:${short ? 'var(--warn)' : 'var(--accent-2)'}"></i>予定込みで不足</div><div class="v num" style="color:${short ? 'var(--warn)' : 'var(--accent-2)'}">${fmtCr(short)}<small>単位</small></div><div class="d">${short ? 'あと履修登録が必要' : '要件単位に到達見込み'}</div></div>
    </div></div>`;

  // 出欠の要注意
  const risky = all.map(c => ({ c, i: attInfo(c) })).filter(x => x.i && x.i.active && x.i.level !== 'ok').sort((a, b) => a.i.rem - b.i.rem);
  if (risky.length) {
    h += `<div class="sec"><h3>出欠の要注意 <small>あと1回以下</small></h3><div class="rows">` + risky.map(({ c, i }) =>
      `<button class="row" data-open="${esc(c.id)}" style="${cvars(c.color)}"><i class="dot"></i><div style="min-width:0"><div class="rn">${esc(c.name)}</div><div class="rs num">${yearLabel(c.year)} · 欠席 ${i.A} · 遅刻 ${i.L} · 上限 ${i.allowed}回 / 全${i.total}回</div></div><div class="rc lv-${i.level}" style="font-size:12.5px">${attRestText(i)}</div><span class="gbadge" style="color:${i.level === 'warn' ? 'var(--warn)' : 'var(--danger)'};border-color:currentColor;font-family:var(--mono)">${i.rem < 0 ? '超過' : '残' + i.rem}</span></button>`).join('') + '</div></div>';
  }

  // 学年別
  const cy = acadYear();
  h += `<div class="sec"><h3>学年別 <small>タップで一覧へ</small></h3><div class="ytable">` + yearsList().map(y => {
    const s = stats(coursesOfYear(y));
    const max = Math.max(s.reg, 1);
    return `<button class="yrow ${y === cy ? 'cur' : ''}" data-goyear="${y}"><div><b>${yearLabel(y)}</b><span class="ysub">${y}年度</span></div>
      <div style="min-width:0"><div class="sbar"><i class="e" style="width:${s.earned / max * 100}%"></i><i class="p" style="width:${s.planned / max * 100}%"></i></div>
        <div class="ymeta"><span>取得 ${fmtCr(s.earned)} / 予定 ${fmtCr(s.planned)}${s.failed ? ` / 不可 ${fmtCr(s.failed)}` : ''}</span><span>${s.n}科目</span></div></div>
      <div class="ynum"><b>${fmtGpa(s.gpa)}</b><small>GPA</small></div></button>`;
  }).join('') + '</div></div>';

  h += reqHTML();

  // 成績分布
  const codes = ['g0', 'g1', 'g2', 'g3', 'g4', 'P', 'N'];
  const cnt = codes.map(g => all.filter(c => c.grade === g).length);
  const total = cnt.reduce((a, b) => a + b, 0);
  h += `<div class="sec"><h3>成績分布 <small>${total}科目 評価済み</small></h3>`;
  h += total ? `<div class="dist">${codes.map((g, i) => cnt[i] ? `<i style="flex:${cnt[i]};background:${gradeMeta(g).color}">${cnt[i] / total > .08 ? esc(gradeMeta(g).label) : ''}</i>` : '').join('')}</div>
    <div class="dlegend">${codes.map((g, i) => cnt[i] ? `<span><i style="background:${gradeMeta(g).color}"></i>${esc(gradeMeta(g).label)} <b>${cnt[i]}</b></span>` : '').join('')}</div>`
    : '<div class="empty-state" style="padding:24px 16px"><p style="margin:0">授業の詳細画面から成績を入力すると、ここに分布と GPA が出ます。</p></div>';
  h += '</div>';
  if (!all.length) h = emptyHTML('まだ授業がありません') + h;
  return h;
}

/* ===== sheet ===== */
let onSheetClose = null;
function openSheet(title, body, foot, mount) {
  const sh = $('#sheet');
  sh.innerHTML = `<div class="grab"></div><div class="sh-head"><h2>${title}</h2><button class="iconbtn" data-close aria-label="閉じる">${ICON.close}</button></div>
    <div class="sh-body">${body}</div>${foot ? `<div class="sh-foot">${foot}</div>` : ''}`;
  requestAnimationFrame(() => { sh.classList.add('open'); $('#scrim').classList.add('open'); });
  document.body.classList.add('lock');
  if (mount) mount(sh);
}
function closeSheet() {
  $('#sheet').classList.remove('open');
  $('#scrim').classList.remove('open');
  document.body.classList.remove('lock');
  if (onSheetClose) { const f = onSheetClose; onSheetClose = null; f(); }
}
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('open')) closeSheet(); });
$('#sheet').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });

let toastT;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
function armButton(btn, label, action) {
  btn.addEventListener('click', () => {
    if (btn.classList.contains('armed')) { action(); return; }
    const orig = btn.innerHTML;
    btn.classList.add('armed');
    btn.innerHTML = label;
    setTimeout(() => { btn.classList.remove('armed'); btn.innerHTML = orig; }, 3000);
  });
}

/* ===== detail ===== */
function attSectionHTML(c) {
  const head = `<h4><svg class="ic" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>出欠</h4>`;
  if (c.attOff) return head + '<div class="body" style="color:var(--dim)">この授業は出欠を管理しない設定です（編集から変更できます）</div>';
  const i = attInfo(c);
  if (!i) return head + '<div class="body" style="color:var(--dim)">曜日・時限が未設定のため総回数が分かりません。編集で「総授業回数」を入れると管理できます。</div>';
  const src = { manual: '手入力', range: 'クォーター期間から自動計算', default: `${DEFAULT_SESSIONS_PER_Q}回×コマ数×クォーター数で仮計算` }[i.src];
  const lateRule = state.settings.lateRatio ? `遅刻${state.settings.lateRatio}回＝欠席1回` : '遅刻は数えない';
  const dots = Array.from({ length: Math.max(i.allowed, i.used) }, (_, k) => `<i class="${k < i.used ? (k < i.allowed ? 'u' : 'x') : ''}"></i>`).join('');
  const log = c.absences.slice().reverse().map(a => {
    const d = new Date(a.date + 'T00:00');
    return `<div><em class="${a.type === 'A' ? 'ta' : 'tl'}">${a.type === 'A' ? '欠席' : '遅刻'}</em><span class="dt">${a.date.slice(5).replace('-', '/')}（${'日月火水木金土'[d.getDay()]}）${a.p ? ` ${a.p}限` : ''}</span><button type="button" data-rm="${a.date}|${a.p}|${a.type}" aria-label="記録を削除">${ICON.close}</button></div>`;
  }).join('');
  return head + `<div class="attbig"><b class="num lv-${i.level}">${i.rem < 0 ? '超過' : i.rem}</b><span>${i.rem < 0 ? `上限を ${-i.rem} 回超えています` : i.rem === 0 ? '回 — もう休めません' : '回 休める'}</span></div>
    ${dots ? `<div class="dots" title="欠席換算 ${i.used} / 上限 ${i.allowed}">${dots}</div>` : ''}
    <div class="attnums"><div><b class="num">${i.A}</b><small>欠席</small></div><div><b class="num">${i.L}</b><small>遅刻</small></div><div><b class="num">${i.allowed}</b><small>上限</small></div><div><b class="num">${i.total}</b><small>総回数</small></div></div>
    <div class="hint">総回数：${src}。上限：${c.attMax !== '' ? '手入力' : `総回数の1/${state.settings.attRatio}未満`}。${lateRule}。</div>
    <div class="attadd"><input type="date" id="attDate" value="${isoDate(new Date())}" aria-label="日付"><button type="button" class="abtn a" data-addatt="A">＋欠席</button><button type="button" class="abtn l" data-addatt="L">＋遅刻</button></div>
    ${log ? `<div class="alog">${log}</div>` : ''}`;
}
function openDetail(id) {
  const c = state.courses.find(x => x.id === id);
  if (!c) return;
  const sec = (icon, title, body, cls = '') => `<div class="dsec ${cls}"><h4>${icon}${title}</h4><div class="body" style="${body ? '' : 'color:var(--dim)'}">${body || '未入力'}</div></div>`;
  const body = `
    <div class="dt-hero" style="${cvars(c.color)}"><h3>${esc(c.name)}</h3>
      <div class="tags"><span class="tag">${yearLabel(c.year)} · ${c.year}年度</span>${c.quarters.map(q => `<span class="tag">Q${q}</span>`).join('')}${slotTags(c) || '<span class="tag q">時間割外</span>'}</div></div>
    <div class="dsec"><h4>${ICON.cap}成績 <span style="margin-left:auto;letter-spacing:.04em;text-transform:none" id="dGradeNote"></span></h4><div class="gpick" id="dGrade">${gradePicker(c.grade)}</div></div>
    <div class="dgrid">
      ${sec(ICON.pin, '教室', esc(c.room))}
      ${sec(ICON.user, '先生', esc(c.teacher))}
      ${sec(ICON.star, '単位', c.credits ? esc(c.credits) : '')}
      ${sec(ICON.tag, '科目区分', esc(catPath(c.category)))}
    </div>
    <div class="dsec" id="dAtt">${attSectionHTML(c)}</div>
    <div class="dsec" id="dEx">${courseExamsHTML(c)}</div>
    ${sec(ICON.book, '教科書', esc(c.textbook))}
    <div class="dsec"><h4>${ICON.chart}評価基準</h4>${evalHTML(c)}</div>
    ${c.url ? sec(ICON.link, 'シラバス', isUrl(c.url) ? `<a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.url)}</a>` : esc(c.url)) : ''}
    ${c.memo ? sec(ICON.note, 'メモ', esc(c.memo)) : ''}`;
  const foot = `<button class="btn danger" id="dDel">${ICON.trash}削除</button><span class="spacer"></span><button class="btn pri" id="dEdit">${ICON.edit}編集</button>`;
  openSheet('授業の詳細', body, foot, sh => {
    const note = () => { const m = gradeMeta(c.grade); $('#dGradeNote', sh).textContent = m.gp != null ? `GP ${m.gp}` : m.kind === 'pending' ? '単位は「取得予定」に計上' : m.kind === 'pass' ? 'GPA対象外・単位取得' : m.kind === 'fail' ? '単位なし' : '集計から除外'; };
    note();
    $('#dGrade', sh).addEventListener('click', e => {
      const b = e.target.closest('.gb'); if (!b) return;
      c.grade = b.dataset.g;
      $$('.gb', sh).forEach(x => x.classList.toggle('on', x === b));
      note(); save(); render();
      toast(`成績を「${gradeMeta(c.grade).label}」にしました`);
    });
    const attEl = $('#dAtt', sh);
    attEl.addEventListener('click', e => {
      const add = e.target.closest('[data-addatt]');
      const rm = e.target.closest('[data-rm]');
      if (add) {
        const date = $('#attDate', attEl).value;
        if (!date) { toast('日付を選んでください'); return; }
        const dow = new Date(date + 'T00:00').getDay() - 1;
        const slot = c.slots.find(s => s.d === dow);
        recordAbsence(c, add.dataset.addatt, date, slot ? slot.p : 0);
      } else if (rm) {
        const [date, p, type] = rm.dataset.rm.split('|');
        const k = c.absences.findIndex(a => a.date === date && a.p === +p && a.type === type);
        if (k >= 0) c.absences.splice(k, 1);
        save(); toast('記録を削除しました');
      } else return;
      attEl.innerHTML = attSectionHTML(c);
      render();
    });
    $('#dEx', sh).addEventListener('click', e => {
      const o = e.target.closest('[data-xopen]'), a = e.target.closest('[data-xadd]');
      if (o) openExamDetail(o.dataset.xopen); else if (a) openExamForm(null, { courseId: a.dataset.xadd });
    });
    $('#dEdit', sh).addEventListener('click', () => openForm(c.id));
    armButton($('#dDel', sh), `${ICON.trash}本当に削除`, () => {
      detachExams([c.id]);
      state.courses = state.courses.filter(x => x.id !== c.id);
      save(); closeSheet(); render(); toast(`「${c.name}」を削除しました`);
    });
  });
}

/* ===== form ===== */
function openForm(id, preset) {
  const editing = id ? state.courses.find(x => x.id === id) : null;
  const usedColors = state.courses.filter(c => c.year === state.ui.y).map(c => c.color);
  const c = editing ? JSON.parse(JSON.stringify(editing)) : {
    name: '', teacher: '', room: '', textbook: '', credits: '', url: '', memo: '', evalNote: '', evals: [], category: '', grade: '',
    year: state.ui.y,
    color: COLORS.find(x => !usedColors.includes(x)) || COLORS[state.courses.length % COLORS.length],
    quarters: [state.ui.q], slots: preset ? [preset] : [],
  };
  const busyWith = (d, p) => state.courses.filter(o => o.id !== id && o.year === c.year && o.grade !== 'W' && o.slots.some(s => s.d === d && s.p === p) && o.quarters.some(q => c.quarters.includes(q)));
  const busy = (d, p) => busyWith(d, p).length > 0;
  const slotGrid = () => '<div></div>' + DAYS.map(d => `<div class="sh">${d}</div>`).join('') +
    PERIODS.map(P => `<div class="sp">${P.n}</div>` + DAYS.map((_, d) => `<button type="button" class="slot ${c.slots.some(s => s.d === d && s.p === P.n) ? 'on' : ''} ${busy(d, P.n) ? 'busy' : ''}" data-d="${d}" data-p="${P.n}" aria-label="${DAYS[d]}曜${P.n}限"></button>`).join('')).join('');
  const erow = x => `<div class="erow"><input type="text" class="el" placeholder="項目（例：期末試験）" value="${esc(x.label)}"><div class="pct"><input type="number" class="ep num" inputmode="numeric" min="0" max="100" step="1" placeholder="0" value="${x.pct || ''}"></div><button type="button" class="x" aria-label="削除">${ICON.close}</button></div>`;
  const years = yearsList();
  if (!years.includes(c.year)) years.push(c.year);
  const attAuto = (() => {
    const t = totalSessions({ ...c, sessions: '' });
    return { total: t ? t.n : null, allowed: t ? Math.max(0, Math.ceil(t.n / state.settings.attRatio - 1e-9) - 1) : null };
  })();
  const catPick = () => {
    const cs = state.settings.cats, tops = cs.filter(x => !x.parent);
    const chip = k => `<button type="button" class="cc ${k.name === c.category ? 'on' : ''}" data-cat="${esc(k.name)}">${esc(k.name)}</button>`;
    const solo = tops.filter(t => !cs.some(k => k.parent === t.id));
    let h = solo.length ? `<div class="cgrp"><div class="cchips">${solo.map(chip).join('')}</div></div>` : '';
    for (const t of tops) {
      const kids = cs.filter(k => k.parent === t.id);
      if (kids.length) h += `<div class="cgrp"><span class="cl">${esc(t.name)}${t.req ? `<em>${fmtCr(t.req)}単位</em>` : ''}</span><div class="cchips">${kids.map(chip).join('')}</div></div>`;
    }
    if (c.category && !cs.some(x => x.name === c.category)) h += `<div class="cgrp"><span class="cl">以前の区分</span><div class="cchips">${chip({ name: c.category })}</div></div>`;
    return h || '<div class="hint">設定で科目区分を登録すると、ここから選べます。</div>';
  };
  const body = `<form id="cf" autocomplete="off" novalidate>
    <div class="fg" style="margin-top:6px"><label for="fName">授業名 <span class="req">*</span></label><input type="text" id="fName" placeholder="例：線形代数学Ⅰ" value="${esc(c.name)}" maxlength="80"></div>
    <div class="row2"><div class="fg"><label for="fYear">学年・年度</label><select id="fYear">${years.sort((a, b) => a - b).map(y => `<option value="${y}" ${y === c.year ? 'selected' : ''}>${yearLabel(y)}（${y}年度）</option>`).join('')}</select></div>
      <div class="fg"><label for="fCred">単位数</label><input type="number" id="fCred" inputmode="decimal" min="0" step="0.5" placeholder="例：2" value="${esc(c.credits)}"></div></div>
    <div class="fg"><span class="fl">クォーター（複数選択可）</span><div class="toggles" id="fQ">${QUARTERS.map(q => `<button type="button" class="tg ${c.quarters.includes(q) ? 'on' : ''}" data-q="${q}">Q${q}</button>`).join('')}</div></div>
    <div class="fg"><span class="fl">曜日・時限（複数選択可・集中講義などは空欄でOK）</span><div class="slots" id="fS">${slotGrid()}</div><div class="hint" id="slotHint"></div></div>
    <div class="row2"><div class="fg"><label for="fRoom">教室</label><input type="text" id="fRoom" placeholder="例：A棟 301" value="${esc(c.room)}"></div>
      <div class="fg"><label for="fTeacher">先生</label><input type="text" id="fTeacher" placeholder="例：山田 太郎" value="${esc(c.teacher)}"></div></div>
    <div class="fg"><span class="fl">科目区分（卒業要件）</span><div id="fCat">${catPick()}</div><div class="hint">選んだ区分は「単位・成績」の卒業要件に集計されます。もう一度タップすると解除。</div></div>
    <div class="fg"><span class="fl">成績</span><div class="gpick" id="fG">${gradePicker(c.grade)}</div><div class="hint">成績が出るまでは「履修中」のまま（取得予定単位に計上）。</div></div>
    <div class="fg"><span class="fl">出欠管理</span><div class="toggles" style="grid-template-columns:1fr 1fr" id="fAtt"><button type="button" class="tg ${c.attOff ? '' : 'on'}" data-a="on">管理する</button><button type="button" class="tg ${c.attOff ? 'on' : ''}" data-a="off">しない</button></div>
      <div class="row2"><div class="fg"><label for="fSess">総授業回数</label><input type="number" id="fSess" inputmode="numeric" min="1" step="1" placeholder="${attAuto.total != null ? `自動（${attAuto.total}回）` : '要入力'}" value="${esc(c.sessions || '')}"></div>
        <div class="fg"><label for="fAttMax">休める回数</label><input type="number" id="fAttMax" inputmode="numeric" min="0" step="1" placeholder="${attAuto.allowed != null ? `自動（${attAuto.allowed}回）` : '自動'}" value="${esc(c.attMax || '')}"></div></div>
      <div class="hint">空欄なら自動：総回数はクォーター期間（未設定なら${DEFAULT_SESSIONS_PER_Q}回/クォーター）から、休める回数は「総回数の1/${state.settings.attRatio}以上で不可」から計算。シラバスに回数が書いてあれば上書きしてください。</div></div>
    <div class="fg"><label for="fBook">教科書</label><textarea id="fBook" placeholder="書名・著者・出版社・ISBN など（複数可）">${esc(c.textbook)}</textarea></div>
    <div class="fg"><span class="fl">評価基準</span>
      <div class="presets" id="ePre">${EVAL_PRESETS.map(p => `<button type="button" class="pre" data-p="${esc(p)}">＋ ${esc(p)}</button>`).join('')}</div>
      <div id="eRows">${c.evals.map(erow).join('')}</div>
      <button type="button" class="linkbtn" id="eAdd">＋ 項目を追加</button>
      <div class="etotal"><span>合計</span><b class="num" id="eTot">0%</b></div>
      <textarea id="fENote" style="margin-top:10px;min-height:64px" placeholder="補足（例：出席率2/3以上で受験資格、再試なし）">${esc(c.evalNote)}</textarea></div>
    <div class="fg"><label for="fUrl">シラバスURL</label><input type="url" id="fUrl" placeholder="https://…" value="${esc(c.url)}"></div>
    <div class="fg"><label for="fMemo">メモ</label><textarea id="fMemo" placeholder="持ち物・課題の提出先・連絡事項など">${esc(c.memo)}</textarea></div>
    <div class="fg"><span class="fl">カラー</span><div class="swatches" id="fC">${COLORS.map(x => `<button type="button" class="sw ${x === c.color ? 'on' : ''}" data-c="${x}" style="--c:${x}" aria-label="色 ${x}"></button>`).join('')}</div></div>
  </form>`;
  const foot = `<button class="btn" data-close>キャンセル</button><span class="spacer"></span><button class="btn pri" id="fSave">${editing ? '保存' : '追加'}</button>`;
  openSheet(editing ? '授業を編集' : '授業を追加', body, foot, sh => {
    const rows = $('#eRows', sh);
    const updTotal = () => {
      const t = $$('.ep', rows).reduce((a, i) => a + (Number(i.value) || 0), 0);
      const el = $('#eTot', sh);
      el.textContent = t + '%';
      el.className = 'num ' + (!$$('.erow', rows).length ? '' : t === 100 ? 'ok' : 'bad');
    };
    const refreshBusy = () => $$('.slot', sh).forEach(s => s.classList.toggle('busy', busy(+s.dataset.d, +s.dataset.p)));
    const updHint = () => {
      const h = $('#slotHint', sh);
      const clash = c.slots.filter(s => busy(s.d, s.p));
      if (clash.length) {
        const names = [...new Set(clash.flatMap(s => busyWith(s.d, s.p).map(o => o.name)))];
        h.className = 'hint warn';
        h.textContent = `⚠ ${clash.map(s => DAYS[s.d] + s.p).join('・')} は「${names.join('」「')}」と重複しています（保存は可能です）`;
      } else {
        h.className = 'hint';
        h.textContent = c.slots.length ? c.slots.slice().sort((a, b) => a.d * 10 + a.p - (b.d * 10 + b.p)).map(s => `${DAYS[s.d]}${s.p}限 ${fmtT(PERIODS[s.p - 1].s)}–${fmtT(PERIODS[s.p - 1].e)}`).join(' / ') : 'グレーの点は同じ学年・クォーターで他の授業が入っているコマです';
      }
    };
    const addRow = (label = '') => {
      rows.insertAdjacentHTML('beforeend', erow({ label, pct: 0 }));
      const r = rows.lastElementChild;
      (label ? $('.ep', r) : $('.el', r)).focus();
      updTotal();
    };
    $('#fYear', sh).addEventListener('change', e => { c.year = +e.target.value; refreshBusy(); updHint(); });
    $('#fQ', sh).addEventListener('click', e => {
      const b = e.target.closest('.tg'); if (!b) return;
      const q = +b.dataset.q;
      c.quarters = c.quarters.includes(q) ? c.quarters.filter(x => x !== q) : [...c.quarters, q].sort();
      b.classList.toggle('on');
      refreshBusy(); updHint();
    });
    $('#fS', sh).addEventListener('click', e => {
      const b = e.target.closest('.slot'); if (!b) return;
      const d = +b.dataset.d, p = +b.dataset.p;
      const i = c.slots.findIndex(s => s.d === d && s.p === p);
      if (i >= 0) c.slots.splice(i, 1); else c.slots.push({ d, p });
      b.classList.toggle('on');
      updHint();
    });
    $('#fG', sh).addEventListener('click', e => {
      const b = e.target.closest('.gb'); if (!b) return;
      c.grade = b.dataset.g;
      $$('#fG .gb', sh).forEach(x => x.classList.toggle('on', x === b));
    });
    $('#fCat', sh).addEventListener('click', e => {
      const b = e.target.closest('.cc'); if (!b) return;
      c.category = c.category === b.dataset.cat ? '' : b.dataset.cat;
      $$('#fCat .cc', sh).forEach(x => x.classList.toggle('on', x.dataset.cat === c.category));
    });
    $('#fAtt', sh).addEventListener('click', e => {
      const b = e.target.closest('.tg'); if (!b) return;
      c.attOff = b.dataset.a === 'off';
      $$('#fAtt .tg', sh).forEach(x => x.classList.toggle('on', x === b));
    });
    $('#fC', sh).addEventListener('click', e => {
      const b = e.target.closest('.sw'); if (!b) return;
      c.color = b.dataset.c;
      $$('.sw', sh).forEach(x => x.classList.toggle('on', x === b));
    });
    $('#ePre', sh).addEventListener('click', e => { const b = e.target.closest('.pre'); if (b) addRow(b.dataset.p); });
    $('#eAdd', sh).addEventListener('click', () => addRow());
    rows.addEventListener('click', e => { const b = e.target.closest('.x'); if (b) { b.closest('.erow').remove(); updTotal(); } });
    rows.addEventListener('input', updTotal);
    $('#cf', sh).addEventListener('submit', e => { e.preventDefault(); $('#fSave', sh).click(); });
    $('#fName', sh).addEventListener('input', e => e.target.classList.remove('err'));
    updTotal(); updHint();
    if (!editing && matchMedia('(hover:hover)').matches) setTimeout(() => { const f = $('#fName', sh); if (f) f.focus(); }, 320);

    $('#fSave', sh).addEventListener('click', () => {
      const nameEl = $('#fName', sh);
      if (!nameEl.value.trim()) { nameEl.classList.add('err'); nameEl.focus(); toast('授業名を入力してください'); return; }
      if (!c.quarters.length) { toast('クォーターを1つ以上選んでください'); $('#fQ', sh).scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      const out = normCourse({
        ...c, id: editing ? editing.id : uid(), name: nameEl.value,
        room: $('#fRoom', sh).value.trim(), teacher: $('#fTeacher', sh).value.trim(), textbook: $('#fBook', sh).value.trim(),
        category: c.category, evalNote: $('#fENote', sh).value.trim(), credits: $('#fCred', sh).value.trim(), url: $('#fUrl', sh).value.trim(), memo: $('#fMemo', sh).value.trim(),
        evals: $$('.erow', rows).map(r => ({ label: $('.el', r).value, pct: Number($('.ep', r).value) || 0 })),
        sessions: $('#fSess', sh).value, attMax: $('#fAttMax', sh).value,
      });
      if (editing) state.courses[state.courses.findIndex(x => x.id === editing.id)] = out;
      else state.courses.push(out);
      state.ui.y = out.year;
      if (!out.quarters.includes(state.ui.q)) state.ui.q = out.quarters[0];
      save(); closeSheet(); render();
      toast(editing ? '保存しました' : `「${out.name}」を追加しました`);
      if (editing) setTimeout(() => openDetail(out.id), 360);
    });
  });
}

/* ===== exams / study plan ===== */
const WD = '日月火水木金土';
const todayISO = () => isoDate(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00'); d.setDate(d.getDate() + n); return isoDate(d); };
const dayDiff = iso => Math.round((new Date(iso + 'T00:00') - new Date(todayISO() + 'T00:00')) / 864e5);
const fmtDate = iso => { const d = new Date(iso + 'T00:00'); return `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const fmtMin = m => m >= 60 ? `${+(m / 60).toFixed(1)}h` : `${m}分`;
const dLabel = dd => dd < 0 ? '終了' : dd === 0 ? '今日' : dd === 1 ? '明日' : `D-${dd}`;
const dLevel = dd => dd < 0 ? 'past' : dd <= 3 ? 'hot' : dd <= 7 ? 'soon' : '';
const examCourse = ex => ex.courseId ? state.courses.find(c => c.id === ex.courseId) : null;
const examHead = ex => (examCourse(ex) || {}).name || ex.title || ex.kind;
const examSub = ex => examCourse(ex) ? ex.title || ex.kind : ex.kind;
const examColor = ex => (examCourse(ex) || {}).color || ex.color;
const examWhen = ex => fmtDate(ex.date) + (ex.time ? ' ' + fmtT(ex.time) : '');
const byExamDate = (a, b) => a.date.localeCompare(b.date) || (a.time || '99').localeCompare(b.time || '99');
const upcomingExams = () => state.exams.filter(x => dayDiff(x.date) >= 0).sort(byExamDate);
const pastExams = () => state.exams.filter(x => dayDiff(x.date) < 0).sort((a, b) => byExamDate(b, a));
// 授業の評価基準から、この試験が成績の何%を占めるかを拾う（「期末試験」⇔「期末テスト」も一致させる）
function examWeight(ex) {
  const c = examCourse(ex);
  if (!c) return null;
  const k2 = ex.kind === 'その他' ? null : ex.kind.slice(0, 2);
  const e = c.evals.find(x => (ex.title && x.label === ex.title) || x.label === ex.kind) || (k2 && c.evals.find(x => x.label.includes(k2)));
  return e && e.pct ? e.pct : null;
}
const studiedMin = ex => ex.logs.reduce((a, l) => a + l.m, 0) + ex.tasks.reduce((a, t) => a + (t.done ? t.m : 0), 0);
function progress(ex) {
  const goal = Math.round(ex.hours * 60), done = studiedMin(ex);
  return { goal, done, pct: goal ? Math.min(1, done / goal) : 0, tAll: ex.tasks.length, tDone: ex.tasks.filter(t => t.done).length };
}
const minutesOn = date => state.exams.reduce((a, x) => a + x.logs.reduce((s, l) => s + (l.d === date ? l.m : 0), 0) + x.tasks.reduce((s, t) => s + (t.done === date ? t.m : 0), 0), 0);
const plannedOn = date => state.exams.reduce((a, x) => a + x.tasks.reduce((s, t) => s + (t.d === date ? t.m : 0), 0), 0);
function todayTasks() {
  const T = todayISO();
  const out = [];
  for (const ex of upcomingExams()) for (const t of ex.tasks) {
    if ((!t.done && t.d && t.d <= T) || t.done === T) out.push({ ex, t });
  }
  return out.sort((a, b) => !!a.t.done - !!b.t.done || (a.t.d || '').localeCompare(b.t.d || '') || byExamDate(a.ex, b.ex));
}
function dayTasks(date) {
  const out = [];
  for (const ex of state.exams) for (const t of ex.tasks) if (t.d === date) out.push({ ex, t });
  return out.sort((a, b) => !!a.t.done - !!b.t.done || byExamDate(a.ex, b.ex));
}
function toggleTask(eid, tid) {
  const ex = state.exams.find(x => x.id === eid);
  const t = ex && ex.tasks.find(x => x.id === tid);
  if (!t) return;
  t.done = t.done ? '' : todayISO();
  save();
  if (t.done) toast(`完了：${t.t}${t.m ? `（+${fmtMin(t.m)}）` : ''}`);
}
// 授業を消しても試験は残す。名前と色を試験側へ写してから紐づけを外す
function detachExams(ids) {
  for (const x of state.exams) {
    if (!ids.includes(x.courseId)) continue;
    const c = examCourse(x);
    if (c) { x.title = x.title ? `${c.name} ${x.title}` : c.name; x.color = c.color; }
    x.courseId = '';
  }
}
// 範囲の各行を今日〜試験前日に均等配分し、前日は総復習。他の試験日は（空く日がある限り）避ける
function autoPlan(ex) {
  const T = todayISO(), dd = dayDiff(ex.date);
  if (dd < 1) return null;
  ex.tasks = ex.tasks.filter(t => t.done || !t.auto);
  const finished = new Set(ex.tasks.filter(t => t.done).map(t => t.t));
  const items = ex.scope.split('\n').map(s => s.replace(/^[\s・\-*●○•◦▪]+/, '').trim()).filter(Boolean);
  const list = items.length ? items.filter(t => !finished.has(t)) : ['試験範囲の学習'];
  if (!list.length) list.push('演習・問題演習');
  let days = Array.from({ length: dd }, (_, i) => addDays(T, i));
  const free = days.filter(d => !state.exams.some(o => o.id !== ex.id && o.date === d));
  if (free.length) days = free;
  const review = days.length >= 2 ? days.pop() : null;
  const round5 = m => Math.max(15, Math.round(m / 5) * 5);
  const manualOpen = ex.tasks.reduce((a, t) => a + (t.done ? 0 : t.m), 0);
  const remain = Math.max(ex.hours * 60 - studiedMin(ex) - manualOpen, list.length * 15 + (review ? 30 : 0));
  const reviewM = review ? round5(remain * REVIEW_SHARE) : 0;
  const each = round5((remain - reviewM) / list.length);
  list.forEach((t, i) => ex.tasks.push({ id: uid(), t, d: days[Math.floor(i * days.length / list.length)], m: each, done: '', auto: true }));
  if (review) ex.tasks.push({ id: uid(), t: '総復習（範囲全体・弱点の確認）', d: review, m: reviewM, done: '', auto: true });
  return { n: list.length + (review ? 1 : 0), days: days.length + (review ? 1 : 0) };
}

function taskRowHTML(ex, t, inExam) {

  return `<div class="tk ${t.done ? 'done' : ''} ${inExam ? 'x5' : ''}" style="${cvars(examColor(ex))}"><button type="button" class="ck" data-tk="${esc(ex.id)}|${esc(t.id)}" aria-label="${t.done ? '未完了に戻す' : '完了にする'}"></button>` +
    `<div class="tx"><b>${esc(t.t)}</b><small>${sub}</small></div><span class="tm">${t.m ? fmtMin(t.m) : ''}</span>` +

}

  const dd = dayDiff(ex.date), pr = progress(ex);

    `<div class="rc" style="font-size:13px">${Math.round(pr.pct * 100)}<small>%</small></div><span class="dbadge inl ${dLevel(dd)} num" style="font-size:11.5px;padding:4px 7px">${dLabel(dd)}</span></button>`;
}
function examCardHTML(ex) {

function courseExamsHTML(c) {

    `<button type="button" class="linkbtn" data-xadd="${esc(c.id)}">＋ この授業の試験を追加</button>`;

function examHTML() {
  if (!state.exams.length) {
    return `<div class="empty-state fade-in"><b>試験・テストはまだありません</b><p>試験日と範囲を登録すると、今日から試験前日までの勉強計画を自動で作ります。<br>勉強した時間を記録して、目標までの進み具合を確認できます。</p><button class="btn pri" data-xadd="">${ICON.plus}試験を追加</button></div>`;
  }
  const T = todayISO();
  const up = upcomingExams(), past = pastExams();
  let h = '';
  if (up.length) {
    const nx = up[0], dd = dayDiff(nx.date), pr = progress(nx), w = examWeight(nx);
    h += `<button class="xnext fade-in" data-xopen="${esc(nx.id)}" style="${cvars(examColor(nx))}">
      <div class="xd"><small>NEXT</small>${dd <= 1 ? `<b class="jp">${dd ? '明日' : '今日'}</b>` : `<b class="num">${dd}</b><em>日後</em>`}</div>
      <div class="xm"><h3>${esc(examHead(nx))}</h3><div class="tags"><span class="tag c">${esc(examSub(nx))}</span><span class="tag num">${examWhen(nx)}</span>${nx.room ? `<span class="tag">${esc(nx.room)}</span>` : ''}${w != null ? `<span class="tag q num">評価の${w}%</span>` : ''}</div>
        <div class="pbar"><i style="width:${pr.pct * 100}%"></i></div><div class="pmeta"><span>勉強 ${fmtMin(pr.done)} / ${fmtMin(pr.goal)}</span><span>${pr.tAll ? `タスク ${pr.tDone}/${pr.tAll}` : 'タスク未作成'}</span></div></div></button>`;
  } else {
    h += `<div class="empty-state fade-in" style="padding:28px 16px"><b>今後の試験はありません</b><p style="margin:0 0 14px">次の試験が決まったら登録しましょう。</p><button class="btn pri" data-xadd="">${ICON.plus}試験を追加</button></div>`;
  }
  const week = Array.from({ length: 7 }, (_, i) => minutesOn(addDays(T, -i))).reduce((a, b) => a + b, 0);
  const todo = todayTasks(), open = todo.filter(x => !x.t.done);
  const soon = up.filter(x => dayDiff(x.date) < PLAN_DAYS);
  h += `<div class="xtiles">
    <div class="tile"><div class="k"><i style="background:#3de0d0"></i>7日間</div><div class="v num">${fmtMin(week)}</div><div class="d">今日 ${fmtMin(minutesOn(T))}</div></div>
    <div class="tile"><div class="k"><i style="background:rgba(139,124,255,.85)"></i>今日の残り</div><div class="v num">${open.length}<small>件</small></div><div class="d">${fmtMin(open.reduce((a, x) => a + x.t.m, 0))}</div></div>
    <div class="tile"><div class="k"><i style="background:var(--warn)"></i>${PLAN_DAYS}日以内</div><div class="v num">${soon.length}<small>試験</small></div><div class="d">${soon.length ? '直近 ' + fmtDate(soon[0].date) : '予定なし'}</div></div></div>`;

  h += `<div class="sec"><h3>今日やること <small>${fmtDate(T)}</small></h3>` + (todo.length
    ? `<div class="tks">${todo.map(({ ex, t }) => taskRowHTML(ex, t, false)).join('')}</div>`
    : `<div class="empty-state" style="padding:22px 16px"><p style="margin:0">今日の勉強タスクはありません。試験の詳細から「範囲から計画を自動作成」するか、タスクを追加してください。</p></div>`) + '</div>';

  const plan = Array.from({ length: PLAN_DAYS }, (_, i) => { const d = addDays(T, i); return { d, pl: plannedOn(d), dn: minutesOn(d), ex: state.exams.filter(x => x.date === d).sort(byExamDate) }; });
  const max = Math.max(60, ...plan.map(p => Math.max(p.pl, p.dn)));
  h += `<div class="sec"><h3>${PLAN_DAYS}日間の計画 <small>日付をタップで詳細</small></h3><div class="strip">` + plan.map((p, i) => {
    const wd = new Date(p.d + 'T00:00').getDay(), ex = p.ex[0];
    return `<button class="dcol ${i === 0 ? 'today' : ''} ${wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''} ${ex ? 'exam' : ''}" data-xday="${p.d}" ${ex ? `style="${cvars(examColor(ex))}"` : ''} aria-label="${fmtDate(p.d)} 予定${fmtMin(p.pl)}${ex ? ' 試験あり' : ''}">` +
      `${ex ? '<i class="xmk"></i>' : ''}<span class="w">${i === 0 ? '今日' : WD[wd]}</span><span class="n num">${+p.d.slice(8)}</span><span class="xt">${ex ? (p.ex.length > 1 ? `試験×${p.ex.length}` : '試験') : ''}</span>` +
      `<span class="bars"><i class="pl" style="height:${p.pl / max * 100}%"></i><i class="dn" style="height:${Math.min(p.dn, max) / max * 100}%"></i></span><span class="m num">${p.pl ? fmtMin(p.pl) : ''}</span></button>`;
  }).join('') + `</div><div class="legend-mini"><span><i style="background:rgba(139,124,255,.8)"></i>予定したタスク</span><span><i style="background:#3de0d0"></i>勉強した時間</span></div></div>`;

  if (up.length) h += `<div class="sec"><h3>試験一覧 <small>${up.length}件</small></h3><div class="xlist">${up.map(examCardHTML).join('')}</div></div>`;
  if (past.length) h += `<details class="past"><summary>終了した試験 · ${past.length}</summary><div class="rows">${past.map(x => examRowHTML(x)).join('')}</div></details>`;
  return h;
}

function openExamDetail(id) {
  const ex = state.exams.find(x => x.id === id);
  if (!ex) return;
  const foot = `<button class="btn danger" id="xDel">${ICON.trash}削除</button><span class="spacer"></span><button class="btn pri" id="xEdit">${ICON.edit}編集</button>`;
  openSheet('試験の詳細', examDetailBody(ex), foot, sh => {
    const body = $('.sh-body', sh);
    const refresh = () => { body.innerHTML = examDetailBody(ex); render(); };
    body.addEventListener('click', e => {
      const b = e.target.closest('[data-tk],[data-rmtk],[data-log],[data-rmlog],[data-copen],#tkAdd,#xPlan');
      if (!b) return;
      const d = b.dataset;
      if (d.tk) { toggleTask(...d.tk.split('|')); refresh(); }
      else if (d.rmtk) { ex.tasks = ex.tasks.filter(t => t.id !== d.rmtk); save(); refresh(); toast('タスクを削除しました'); }
      else if (d.log) { ex.logs.push({ d: todayISO(), m: +d.log }); save(); refresh(); toast(`${d.log}分の勉強を記録しました（合計 ${fmtMin(studiedMin(ex))}）`); }
      else if (d.rmlog) { ex.logs.splice(+d.rmlog, 1); save(); refresh(); toast('記録を削除しました'); }
      else if (d.copen) openDetail(d.copen);
      else if (b.id === 'tkAdd') {
        const tEl = $('#tkT', body), t = tEl.value.trim();
        if (!t) { tEl.classList.add('err'); tEl.focus(); toast('タスク名を入力してください'); return; }
        ex.tasks.push({ id: uid(), t, d: $('#tkD', body).value, m: Math.max(0, parseInt($('#tkM', body).value, 10) || 0), done: '', auto: false });
        save(); refresh(); toast('タスクを追加しました');

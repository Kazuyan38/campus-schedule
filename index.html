    <div class="meta">${mi(ICON.pin, 'ROOM', c.room)}${mi(ICON.user, 'TEACHER', c.teacher)}${mi(ICON.book, 'TEXTBOOK', c.textbook, true)}</div>
    <div class="mi full">${ICON.chart}<div style="min-width:0;flex:1"><span class="k">GRADING</span>${evalHTML(c)}</div></div>
    ${c.memo ? mi(ICON.note, 'MEMO', c.memo, true) : ''}
  </button>`).join('') + '</div>';
}
function emptyHTML(msg, withAdd = true) {
  return `<div class="empty-state fade-in"><b>${msg}</b><p>時間割のマスをタップするか、＋ボタンから授業を追加してください。<br>別の端末のデータは「共有」ボタンのリンクから取り込めます。</p>${withAdd ? `<button class="btn pri" data-add="">${ICON.plus}授業を追加</button>` : ''}</div>`;
}

/* ----- stats ----- */
function statsHTML() {
  const all = state.courses;
  const st = stats(all);
  const req = state.settings.required;
  const remain = Math.max(0, req - st.earned);
  const short = Math.max(0, req - st.earned - st.planned);
  const R = 70, C = 2 * Math.PI * R;
  const ef = Math.min(1, st.earned / req), pf = Math.min(1 - ef, st.planned / req);
  let h = '';
  if (!state.settings.entrySet) {
    h += `<div class="banner">${ICON.cap}<div>入学年度が未設定です。いまは <b>${state.settings.entryYear}年度入学</b> として学年を表示しています。</div><button class="btn" id="goSettings">設定する</button></div>`;
  }
  h += `<div class="hero fade-in">
    <div class="ring"><svg viewBox="0 0 176 176">
      <circle cx="88" cy="88" r="${R}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="14"/>
      <circle cx="88" cy="88" r="${R}" fill="none" stroke="rgba(139,124,255,.55)" stroke-width="14" stroke-dasharray="${pf * C} ${C}" stroke-dashoffset="${-ef * C}"/>
      <circle cx="88" cy="88" r="${R}" fill="none" stroke="#3de0d0" stroke-width="14" stroke-linecap="${ef > 0 ? 'round' : 'butt'}" stroke-dasharray="${ef * C} ${C}" style="filter:drop-shadow(0 0 6px rgba(61,224,208,.7))"/>
    </svg><div class="ctr"><b class="num">${fmtCr(st.earned)}</b><span>/ ${fmtCr(req)} CREDITS</span><em>${Math.round(ef * 100)}% 取得</em></div></div>
    <div class="tiles">
      <div class="tile"><div class="k"><i style="background:#3de0d0"></i>取得単位</div><div class="v num">${fmtCr(st.earned)}<small>単位</small></div><div class="d">卒業まであと ${fmtCr(remain)}</div></div>
      <div class="tile"><div class="k"><i style="background:rgba(139,124,255,.85)"></i>取得予定</div><div class="v num">${fmtCr(st.planned)}<small>単位</small></div><div class="d">履修中・成績未入力</div></div>
      <div class="tile"><div class="k"><i style="background:linear-gradient(135deg,#8b7cff,#3de0d0)"></i>通算 GPA</div><div class="v num">${fmtGpa(st.gpa)}</div><div class="d">${SCALES[state.settings.scale].labels[0]}=4 〜 ${SCALES[state.settings.scale].labels[4]}=0</div></div>
      <div class="tile"><div class="k"><i style="background:${short ? 'var(--warn)' : 'var(--accent-2)'}"></i>予定込みで不足</div><div class="v num" style="color:${short ? 'var(--warn)' : 'var(--accent-2)'}">${fmtCr(short)}<small>単位</small></div><div class="d">${short ? 'あと履修登録が必要' : '要件単位に到達見込み'}</div></div>
    </div></div>`;

  // 学年別
  const cy = acadYear();
  h += `<div class="sec"><h3>学年別 <small>タップで一覧へ</small></h3><div class="ytable">` + yearsList().map(y => {
    const s = stats(coursesOfYear(y));
    const max = Math.max(s.reg, 1);
    return `<button class="yrow ${y === cy ? 'cur' : ''}" data-goyear="${y}"><div><b>${yearLabel(y)}</b><span class="ysub">${y}年度</span></div>
      <div style="min-width:0"><div class="sbar"><i class="e" style="width:${s.earned / max * 100}%"></i><i class="p" style="width:${s.planned / max * 100}%"></i></div>
        <div class="ymeta"><span>取得 ${fmtCr(s.earned)} / 予定 ${fmtCr(s.planned)}${s.failed ? ` / 不可 ${fmtCr(s.failed)}` : ''}</span><span>${s.n}科目</span></div></div>
      <div class="ynum"><b>${fmtGpa(s.gpa)}</b><small>GPA</small></div></button>`;
  }).join('') + '</div></div>';

  // 科目区分別
  const catNames = [...state.settings.cats.map(c => c.name)];
  all.forEach(c => { const n = c.category || '未分類'; if (!catNames.includes(n)) catNames.push(n); });
  if (catNames.length) {
    h += `<div class="sec"><h3>科目区分別 <small>要件は設定で登録</small></h3><div class="ytable">` + catNames.map(name => {
      const cs = all.filter(c => (c.category || '未分類') === name);
      const s = stats(cs);
      const reqC = (state.settings.cats.find(x => x.name === name) || {}).req || 0;
      const max = Math.max(reqC, s.earned + s.planned, 1);
      const need = reqC ? Math.max(0, reqC - s.earned) : null;
      return `<div class="yrow"><div><b style="font-size:14px">${esc(name)}</b><span class="ysub">${s.n}科目</span></div>
        <div style="min-width:0"><div class="sbar"><i class="e" style="width:${s.earned / max * 100}%"></i><i class="p" style="width:${s.planned / max * 100}%"></i>${reqC ? `<span class="req" style="left:calc(${reqC / max * 100}% - 2px)"></span>` : ''}</div>
          <div class="ymeta"><span>取得 ${fmtCr(s.earned)} / 予定 ${fmtCr(s.planned)}</span><span>${reqC ? `要件 ${fmtCr(reqC)}` : ''}</span></div></div>
        <div class="ynum">${need == null ? `<b>${fmtCr(s.earned)}</b><small>取得</small>` : need ? `<b style="color:var(--warn)">${fmtCr(need)}</b><small>あと</small>` : `<b style="color:var(--accent-2)">✓</b><small>達成</small>`}</div></div>`;
    }).join('') + '</div><div class="legend-mini"><span><i style="background:#3de0d0"></i>取得</span><span><i style="background:rgba(139,124,255,.8)"></i>予定</span><span><i style="background:#fff;width:2px;height:10px"></i>要件</span></div></div>';
  }

  // 成績分布
  const codes = ['g0', 'g1', 'g2', 'g3', 'g4', 'P', 'N'];
  const cnt = codes.map(g => all.filter(c => c.grade === g).length);
  const total = cnt.reduce((a, b) => a + b, 0);
  h += `<div class="sec"><h3>成績分布 <small>${total}科目 評価済み</small></h3>`;
  h += total ? `<div class="dist">${codes.map((g, i) => cnt[i] ? `<i style="flex:${cnt[i]};background:${gradeMeta(g).color}">${cnt[i] / total > .08 ? esc(gradeMeta(g).label) : ''}</i>` : '').join('')}</div>
    <div class="dlegend">${codes.map((g, i) => cnt[i] ? `<span><i style="background:${gradeMeta(g).color}"></i>${esc(gradeMeta(g).label)} <b>${cnt[i]}</b></span>` : '').join('')}</div>`
    : '<div class="empty-state" style="padding:24px 16px"><p style="margin:0">授業の詳細画面から成績を入力すると、ここに分布と GPA が出ます。</p></div>';
  h += '</div>';
  if (!all.length) h = emptyHTML('まだ授業がありません') + h;
  return h;
}

/* ===== sheet ===== */
let onSheetClose = null;
function openSheet(title, body, foot, mount) {
  const sh = $('#sheet');
  sh.innerHTML = `<div class="grab"></div><div class="sh-head"><h2>${title}</h2><button class="iconbtn" data-close aria-label="閉じる">${ICON.close}</button></div>
    <div class="sh-body">${body}</div>${foot ? `<div class="sh-foot">${foot}</div>` : ''}`;
  requestAnimationFrame(() => { sh.classList.add('open'); $('#scrim').classList.add('open'); });
  document.body.classList.add('lock');
  if (mount) mount(sh);
}
function closeSheet() {
  $('#sheet').classList.remove('open');
  $('#scrim').classList.remove('open');
  document.body.classList.remove('lock');
  if (onSheetClose) { const f = onSheetClose; onSheetClose = null; f(); }
}
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('open')) closeSheet(); });
$('#sheet').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });

let toastT;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
function armButton(btn, label, action) {
  btn.addEventListener('click', () => {
    if (btn.classList.contains('armed')) { action(); return; }
    const orig = btn.innerHTML;
    btn.classList.add('armed');
    btn.innerHTML = label;
    setTimeout(() => { btn.classList.remove('armed'); btn.innerHTML = orig; }, 3000);
  });
}

/* ===== detail ===== */
function openDetail(id) {
  const c = state.courses.find(x => x.id === id);
  if (!c) return;
  const sec = (icon, title, body, cls = '') => `<div class="dsec ${cls}"><h4>${icon}${title}</h4><div class="body" style="${body ? '' : 'color:var(--dim)'}">${body || '未入力'}</div></div>`;
  const body = `
    <div class="dt-hero" style="${cvars(c.color)}"><h3>${esc(c.name)}</h3>
      <div class="tags"><span class="tag">${yearLabel(c.year)} · ${c.year}年度</span>${c.quarters.map(q => `<span class="tag">Q${q}</span>`).join('')}${slotTags(c) || '<span class="tag q">時間割外</span>'}</div></div>
    <div class="dsec"><h4>${ICON.cap}成績 <span style="margin-left:auto;letter-spacing:.04em;text-transform:none" id="dGradeNote"></span></h4><div class="gpick" id="dGrade">${gradePicker(c.grade)}</div></div>
    <div class="dgrid">
      ${sec(ICON.pin, '教室', esc(c.room))}
      ${sec(ICON.user, '先生', esc(c.teacher))}
      ${sec(ICON.star, '単位', c.credits ? esc(c.credits) : '')}
      ${sec(ICON.tag, '科目区分', esc(c.category))}
    </div>
    ${sec(ICON.book, '教科書', esc(c.textbook))}
    <div class="dsec"><h4>${ICON.chart}評価基準</h4>${evalHTML(c)}</div>
    ${c.url ? sec(ICON.link, 'シラバス', isUrl(c.url) ? `<a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.url)}</a>` : esc(c.url)) : ''}
    ${c.memo ? sec(ICON.note, 'メモ', esc(c.memo)) : ''}`;
  const foot = `<button class="btn danger" id="dDel">${ICON.trash}削除</button><span class="spacer"></span><button class="btn pri" id="dEdit">${ICON.edit}編集</button>`;
  openSheet('授業の詳細', body, foot, sh => {
    const note = () => { const m = gradeMeta(c.grade); $('#dGradeNote', sh).textContent = m.gp != null ? `GP ${m.gp}` : m.kind === 'pending' ? '単位は「取得予定」に計上' : m.kind === 'pass' ? 'GPA対象外・単位取得' : m.kind === 'fail' ? '単位なし' : '集計から除外'; };
    note();
    $('#dGrade', sh).addEventListener('click', e => {
      const b = e.target.closest('.gb'); if (!b) return;
      c.grade = b.dataset.g;
      $$('.gb', sh).forEach(x => x.classList.toggle('on', x === b));
      note(); save(); render();
      toast(`成績を「${gradeMeta(c.grade).label}」にしました`);
    });
    $('#dEdit', sh).addEventListener('click', () => openForm(c.id));
    armButton($('#dDel', sh), `${ICON.trash}本当に削除`, () => {
      state.courses = state.courses.filter(x => x.id !== c.id);
      save(); closeSheet(); render(); toast(`「${c.name}」を削除しました`);
    });
  });
}

/* ===== form ===== */
function openForm(id, preset) {
  const editing = id ? state.courses.find(x => x.id === id) : null;
  const usedColors = state.courses.filter(c => c.year === state.ui.y).map(c => c.color);
  const c = editing ? JSON.parse(JSON.stringify(editing)) : {
    name: '', teacher: '', room: '', textbook: '', credits: '', url: '', memo: '', evalNote: '', evals: [], category: '', grade: '',
    year: state.ui.y,
    color: COLORS.find(x => !usedColors.includes(x)) || COLORS[state.courses.length % COLORS.length],
    quarters: [state.ui.q], slots: preset ? [preset] : [],
  };
  const busyWith = (d, p) => state.courses.filter(o => o.id !== id && o.year === c.year && o.grade !== 'W' && o.slots.some(s => s.d === d && s.p === p) && o.quarters.some(q => c.quarters.includes(q)));
  const busy = (d, p) => busyWith(d, p).length > 0;
  const slotGrid = () => '<div></div>' + DAYS.map(d => `<div class="sh">${d}</div>`).join('') +
    PERIODS.map(P => `<div class="sp">${P.n}</div>` + DAYS.map((_, d) => `<button type="button" class="slot ${c.slots.some(s => s.d === d && s.p === P.n) ? 'on' : ''} ${busy(d, P.n) ? 'busy' : ''}" data-d="${d}" data-p="${P.n}" aria-label="${DAYS[d]}曜${P.n}限"></button>`).join('')).join('');
  const erow = x => `<div class="erow"><input type="text" class="el" placeholder="項目（例：期末試験）" value="${esc(x.label)}"><div class="pct"><input type="number" class="ep num" inputmode="numeric" min="0" max="100" step="1" placeholder="0" value="${x.pct || ''}"></div><button type="button" class="x" aria-label="削除">${ICON.close}</button></div>`;
  const years = yearsList();
  if (!years.includes(c.year)) years.push(c.year);
  const cats = [...new Set([...state.settings.cats.map(x => x.name), ...state.courses.map(x => x.category).filter(Boolean), ...CAT_PRESETS])];
  const body = `<form id="cf" autocomplete="off" novalidate>
    <div class="fg" style="margin-top:6px"><label for="fName">授業名 <span class="req">*</span></label><input type="text" id="fName" placeholder="例：線形代数学Ⅰ" value="${esc(c.name)}" maxlength="80"></div>
    <div class="row2"><div class="fg"><label for="fYear">学年・年度</label><select id="fYear">${years.sort((a, b) => a - b).map(y => `<option value="${y}" ${y === c.year ? 'selected' : ''}>${yearLabel(y)}（${y}年度）</option>`).join('')}</select></div>
      <div class="fg"><label for="fCred">単位数</label><input type="number" id="fCred" inputmode="decimal" min="0" step="0.5" placeholder="例：2" value="${esc(c.credits)}"></div></div>
    <div class="fg"><span class="fl">クォーター（複数選択可）</span><div class="toggles" id="fQ">${QUARTERS.map(q => `<button type="button" class="tg ${c.quarters.includes(q) ? 'on' : ''}" data-q="${q}">Q${q}</button>`).join('')}</div></div>
    <div class="fg"><span class="fl">曜日・時限（複数選択可・集中講義などは空欄でOK）</span><div class="slots" id="fS">${slotGrid()}</div><div class="hint" id="slotHint"></div></div>
    <div class="row2"><div class="fg"><label for="fRoom">教室</label><input type="text" id="fRoom" placeholder="例：A棟 301" value="${esc(c.room)}"></div>
      <div class="fg"><label for="fTeacher">先生</label><input type="text" id="fTeacher" placeholder="例：山田 太郎" value="${esc(c.teacher)}"></div></div>
    <div class="fg"><label for="fCat">科目区分</label><input type="text" id="fCat" list="catList" placeholder="例：専門必修・教養・外国語" value="${esc(c.category)}"><datalist id="catList">${cats.map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
    <div class="fg"><span class="fl">成績</span><div class="gpick" id="fG">${gradePicker(c.grade)}</div><div class="hint">成績が出るまでは「履修中」のまま（取得予定単位に計上）。</div></div>
    <div class="fg"><label for="fBook">教科書</label><textarea id="fBook" placeholder="書名・著者・出版社・ISBN など（複数可）">${esc(c.textbook)}</textarea></div>
    <div class="fg"><span class="fl">評価基準</span>
      <div class="presets" id="ePre">${EVAL_PRESETS.map(p => `<button type="button" class="pre" data-p="${esc(p)}">＋ ${esc(p)}</button>`).join('')}</div>
      <div id="eRows">${c.evals.map(erow).join('')}</div>
      <button type="button" class="linkbtn" id="eAdd">＋ 項目を追加</button>
      <div class="etotal"><span>合計</span><b class="num" id="eTot">0%</b></div>
      <textarea id="fENote" style="margin-top:10px;min-height:64px" placeholder="補足（例：出席率2/3以上で受験資格、再試なし）">${esc(c.evalNote)}</textarea></div>
    <div class="fg"><label for="fUrl">シラバスURL</label><input type="url" id="fUrl" placeholder="https://…" value="${esc(c.url)}"></div>
    <div class="fg"><label for="fMemo">メモ</label><textarea id="fMemo" placeholder="持ち物・課題の提出先・連絡事項など">${esc(c.memo)}</textarea></div>
    <div class="fg"><span class="fl">カラー</span><div class="swatches" id="fC">${COLORS.map(x => `<button type="button" class="sw ${x === c.color ? 'on' : ''}" data-c="${x}" style="--c:${x}" aria-label="色 ${x}"></button>`).join('')}</div></div>
  </form>`;
  const foot = `<button class="btn" data-close>キャンセル</button><span class="spacer"></span><button class="btn pri" id="fSave">${editing ? '保存' : '追加'}</button>`;
  openSheet(editing ? '授業を編集' : '授業を追加', body, foot, sh => {
    const rows = $('#eRows', sh);
    const updTotal = () => {
      const t = $$('.ep', rows).reduce((a, i) => a + (Number(i.value) || 0), 0);
      const el = $('#eTot', sh);
      el.textContent = t + '%';
      el.className = 'num ' + (!$$('.erow', rows).length ? '' : t === 100 ? 'ok' : 'bad');
    };
    const refreshBusy = () => $$('.slot', sh).forEach(s => s.classList.toggle('busy', busy(+s.dataset.d, +s.dataset.p)));
    const updHint = () => {
      const h = $('#slotHint', sh);
      const clash = c.slots.filter(s => busy(s.d, s.p));
      if (clash.length) {
        const names = [...new Set(clash.flatMap(s => busyWith(s.d, s.p).map(o => o.name)))];
        h.className = 'hint warn';
        h.textContent = `⚠ ${clash.map(s => DAYS[s.d] + s.p).join('・')} は「${names.join('」「')}」と重複しています（保存は可能です）`;
      } else {
        h.className = 'hint';
        h.textContent = c.slots.length ? c.slots.slice().sort((a, b) => a.d * 10 + a.p - (b.d * 10 + b.p)).map(s => `${DAYS[s.d]}${s.p}限 ${fmtT(PERIODS[s.p - 1].s)}–${fmtT(PERIODS[s.p - 1].e)}`).join(' / ') : 'グレーの点は同じ学年・クォーターで他の授業が入っているコマです';
      }
    };
    const addRow = (label = '') => {
      rows.insertAdjacentHTML('beforeend', erow({ label, pct: 0 }));
      const r = rows.lastElementChild;
      (label ? $('.ep', r) : $('.el', r)).focus();
      updTotal();
    };
    $('#fYear', sh).addEventListener('change', e => { c.year = +e.target.value; refreshBusy(); updHint(); });
    $('#fQ', sh).addEventListener('click', e => {
      const b = e.target.closest('.tg'); if (!b) return;
      const q = +b.dataset.q;
      c.quarters = c.quarters.includes(q) ? c.quarters.filter(x => x !== q) : [...c.quarters, q].sort();
      b.classList.toggle('on');
      refreshBusy(); updHint();
    });
    $('#fS', sh).addEventListener('click', e => {
      const b = e.target.closest('.slot'); if (!b) return;
      const d = +b.dataset.d, p = +b.dataset.p;
      const i = c.slots.findIndex(s => s.d === d && s.p === p);
      if (i >= 0) c.slots.splice(i, 1); else c.slots.push({ d, p });
      b.classList.toggle('on');
      updHint();
    });
    $('#fG', sh).addEventListener('click', e => {
      const b = e.target.closest('.gb'); if (!b) return;
      c.grade = b.dataset.g;
      $$('#fG .gb', sh).forEach(x => x.classList.toggle('on', x === b));
    });
    $('#fC', sh).addEventListener('click', e => {
      const b = e.target.closest('.sw'); if (!b) return;
      c.color = b.dataset.c;
      $$('.sw', sh).forEach(x => x.classList.toggle('on', x === b));
    });
    $('#ePre', sh).addEventListener('click', e => { const b = e.target.closest('.pre'); if (b) addRow(b.dataset.p); });
    $('#eAdd', sh).addEventListener('click', () => addRow());
    rows.addEventListener('click', e => { const b = e.target.closest('.x'); if (b) { b.closest('.erow').remove(); updTotal(); } });
    rows.addEventListener('input', updTotal);
    $('#cf', sh).addEventListener('submit', e => { e.preventDefault(); $('#fSave', sh).click(); });
    $('#fName', sh).addEventListener('input', e => e.target.classList.remove('err'));
    updTotal(); updHint();
    if (!editing && matchMedia('(hover:hover)').matches) setTimeout(() => $('#fName', sh).focus(), 320);

    $('#fSave', sh).addEventListener('click', () => {
      const nameEl = $('#fName', sh);
      if (!nameEl.value.trim()) { nameEl.classList.add('err'); nameEl.focus(); toast('授業名を入力してください'); return; }
      if (!c.quarters.length) { toast('クォーターを1つ以上選んでください'); $('#fQ', sh).scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      const out = normCourse({
        ...c, id: editing ? editing.id : uid(), name: nameEl.value,
        room: $('#fRoom', sh).value.trim(), teacher: $('#fTeacher', sh).value.trim(), textbook: $('#fBook', sh).value.trim(),
        category: $('#fCat', sh).value, evalNote: $('#fENote', sh).value.trim(), credits: $('#fCred', sh).value.trim(), url: $('#fUrl', sh).value.trim(), memo: $('#fMemo', sh).value.trim(),
        evals: $$('.erow', rows).map(r => ({ label: $('.el', r).value, pct: Number($('.ep', r).value) || 0 })),
      });
      if (editing) state.courses[state.courses.findIndex(x => x.id === editing.id)] = out;
      else state.courses.push(out);
      state.ui.y = out.year;
      if (!out.quarters.includes(state.ui.q)) state.ui.q = out.quarters[0];
      save(); closeSheet(); render();
      toast(editing ? '保存しました' : `「${out.name}」を追加しました`);
      if (editing) setTimeout(() => openDetail(out.id), 360);
    });
  });
}

/* ===== share / sync ===== */
function b64u(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64u(t) {
  const s = atob(t.replace(/-/g, '+').replace(/_/g, '/'));
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}
const pipe = async (bytes, stream) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
const payload = () => ({ v: 2, courses: state.courses, settings: state.settings });
async function encodeShare() {
  const bytes = new TextEncoder().encode(JSON.stringify(payload()));
  if ('CompressionStream' in window) {
    try { return 'z' + b64u(await pipe(bytes, new CompressionStream('deflate-raw'))); } catch (e) { /* 非対応形式 → 無圧縮 */ }
  }
  return 'j' + b64u(bytes);
}
async function decodeShare(token) {
  const kind = token[0], bytes = unb64u(token.slice(1));
  let raw;
  if (kind === 'z') {
    if (!('DecompressionStream' in window)) throw new Error('このブラウザは圧縮リンクに未対応です');
    raw = await pipe(bytes, new DecompressionStream('deflate-raw'));
  } else if (kind === 'j') raw = bytes;
  else throw new Error('リンクの形式が不正です');
  return JSON.parse(new TextDecoder().decode(raw));
}
async function shareUrl() {
  return location.href.split('#')[0] + '#d=' + await encodeShare();
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }
}
async function openShare() {
  const url = state.courses.length ? await shareUrl() : '';
  const canShare = !!navigator.share;
  const body = `
    <p class="hint" style="margin:0 0 14px;font-size:13px;color:var(--mute)">データはこの端末のブラウザ内に保存されています。<b style="color:var(--fg)">共有リンク</b>を別の端末（スマホ⇄PC）で開くと、4年分の時間割・成績・設定をまとめて取り込めます。リンクには授業データそのものが含まれ、サーバーには送信されません。</p>
    ${url ? `<span class="fl">共有リンク</span><div class="sharebox"><input type="text" id="shUrl" readonly value="${esc(url)}"><button class="btn" id="shCopy" aria-label="コピー">${ICON.copy}</button></div>
      <div class="hint num">${state.courses.length} 件の授業 · ${url.length.toLocaleString()} 文字</div>
      <div class="stack" style="margin-top:14px">${canShare ? `<button class="btn pri wide" id="shNative">${ICON.share}LINE・メール・AirDrop などで送る</button>` : ''}</div>`
      : '<div class="empty-state" style="padding:26px 16px"><b>まだ授業がありません</b><p style="margin:0">授業を追加すると共有リンクを作れます。</p></div>'}
    <div class="divider"></div>
    <div class="fg"><span class="fl">バックアップ（JSONファイル）</span>
      <div class="row2" style="margin-top:0"><button class="btn" id="shExport" ${state.courses.length ? '' : 'disabled style="opacity:.4"'}>${ICON.down}書き出し</button><button class="btn" id="shImport">${ICON.up}読み込み</button></div>
      <div class="hint">読み込むと現在のデータは置き換わります（確認画面が出ます）。</div></div>`;
  openSheet('共有・同期', body, '', sh => {
    const u = $('#shUrl', sh);
    if (u) {
      u.addEventListener('focus', () => u.select());
      $('#shCopy', sh).addEventListener('click', async () => toast(await copyText(url) ? 'リンクをコピーしました' : 'コピーできませんでした。手動で選択してください'));
    }
    const n = $('#shNative', sh);
    if (n) n.addEventListener('click', async () => {
      try { await navigator.share({ title: '時間割', text: '時間割データ（開くと取り込めます）', url }); } catch (e) { /* ユーザーがキャンセル */ }
    });
    $('#shExport', sh).addEventListener('click', () => {
      if (!state.courses.length) return;
      const blob = new Blob([JSON.stringify(payload(), null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `campus-schedule-${isoDate(new Date()).replace(/-/g, '')}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('JSONを書き出しました');
    });
    $('#shImport', sh).addEventListener('click', () => $('#fileIn').click());
  });
}
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try { confirmImport(JSON.parse(await f.text()), 'ファイル'); }
  catch (err) { toast('JSONを読み込めませんでした'); }
});
function confirmImport(data, source) {
  if (!Array.isArray(data && data.courses)) { toast('時間割データではありません'); return; }
  const next = normalize(data);
  const byYear = [...new Set(next.courses.map(c => c.year))].sort().map(y => `${y}年度: ${next.courses.filter(c => c.year === y).length}`).join(' · ');
  const body = `<div class="dsec" style="margin-top:4px"><h4>${ICON.down}取り込むデータ（${source}）</h4><div class="body"><b style="font-size:26px;font-family:var(--mono)">${next.courses.length}</b> 件の授業<div class="hint num">${byYear}</div></div></div>
    <p class="hint" style="font-size:13px;margin-top:14px">この端末の現在のデータ（${state.courses.length} 件）は <b style="color:var(--warn)">置き換え</b> られます。</p>`;
  const foot = `<button class="btn" data-close>キャンセル</button><span class="spacer"></span><button class="btn pri" id="imOk">置き換えて取り込む</button>`;
  openSheet('データを取り込みますか？', body, foot, sh => {
    $('#imOk', sh).addEventListener('click', () => {
      state = { ...next, ui: { ...state.ui } };
      const ys = yearsList();
      state.ui.y = ys.includes(acadYear()) ? acadYear() : ys[0];
      const cq = quarterByDate();
      if (cq) state.ui.q = cq;
      else if (!coursesIn(state.ui.y, state.ui.q).length) state.ui.q = QUARTERS.find(q => coursesIn(state.ui.y, q).length) || 1;
      save(); closeSheet(); render(); toast(`${next.courses.length} 件の授業を取り込みました`);
    });
  });
}
async function checkHash() {
  const m = location.hash.match(/^#d=([A-Za-z0-9_-]+)$/);
  if (!m) return;
  history.replaceState(null, '', location.href.split('#')[0]);
  try { confirmImport(await decodeShare(m[1]), '共有リンク'); }
  catch (e) { toast('共有リンクを読み込めませんでした：' + e.message); }
}

/* ===== settings ===== */
function openSettings() {
  const S = state.settings;
  const r = S.ranges;
  const cy = acadYear();
  const crow = x => `<div class="crow"><input type="text" class="cn" placeholder="区分名（例：専門必修）" value="${esc(x.name)}" list="catList2"><input type="number" class="cr num" inputmode="decimal" min="0" placeholder="単位" value="${x.req || ''}"><button type="button" class="x" aria-label="削除">${ICON.close}</button></div>`;
  const cats = [...new Set([...state.courses.map(x => x.category).filter(Boolean), ...CAT_PRESETS])];
  const body = `
    <div class="fg" style="margin-top:4px"><span class="fl">入学年度・在籍年数</span>
      <div class="row2" style="margin-top:0"><select id="stEntry">${Array.from({ length: 12 }, (_, i) => cy - 8 + i).map(y => `<option value="${y}" ${y === S.entryYear ? 'selected' : ''}>${y}年度入学</option>`).join('')}</select>
        <select id="stYears">${[4, 5, 6].map(n => `<option value="${n}" ${n === S.years ? 'selected' : ''}>${n}年間</option>`).join('')}</select></div>
      <div class="hint">今年度（${cy}年度）が何年生かを決めます。登録済みの授業は年度で管理しているので、変えても消えません。</div></div>
    <div class="fg"><span class="fl">卒業要件単位</span><input type="number" id="stReq" inputmode="decimal" min="1" value="${S.required}"></div>
    <div class="fg"><span class="fl">成績の段階</span><select id="stScale">${Object.entries(SCALES).map(([k, v]) => `<option value="${k}" ${k === S.scale ? 'selected' : ''}>${v.name}</option>`).join('')}</select>
      <div class="hint">GPA は上から 4・3・2・1・0 で計算します。「合格」「不合格」はGPA対象外、「取消」は集計から除外します。</div></div>
    <div class="fg"><span class="fl">科目区分ごとの要件（任意）</span><div id="stCats">${S.cats.map(crow).join('')}</div>
      <datalist id="catList2">${cats.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
      <button type="button" class="linkbtn" id="stCatAdd">＋ 区分を追加</button>
      <div class="hint">例：専門必修 40 / 教養 24 / 外国語 8。単位・成績画面に達成状況が出ます。</div></div>
    <div class="divider"></div>
    <div class="fg"><span class="fl">クォーター期間（任意・毎年共通）</span>
      ${QUARTERS.map((q, i) => `<div class="qrange"><b>Q${q}</b><input type="date" data-i="${i}" data-k="s" value="${esc(r[i].s)}" aria-label="Q${q} 開始日"><span>〜</span><input type="date" data-i="${i}" data-k="e" value="${esc(r[i].e)}" aria-label="Q${q} 終了日"></div>`).join('')}
      <div class="hint">月日だけを使います（年は無視）。設定すると起動時に今のクォーターを自動で開き、NOW / NEXT に表示します。</div></div>
    <div class="dsec" style="margin-top:20px"><h4>${ICON.clock}時限</h4><div class="body num" style="font-family:var(--mono);font-size:13px">${PERIODS.map(P => `${P.n}限  ${P.s} – ${P.e}`).join('\n')}</div></div>
    <div class="divider"></div>
    <div class="fg"><span class="fl">データ</span><button class="btn danger" id="stWipe" style="width:100%">${ICON.trash}すべての授業を削除</button></div>
    <p class="about">データはこの端末のブラウザ（localStorage）にのみ保存されます。4年間使うので、学期ごとに「共有」からリンクかJSONで控えておくと安心です。</p>`;
  const foot = `<button class="btn" data-close>閉じる</button><span class="spacer"></span><button class="btn pri" id="stSave">保存</button>`;
  openSheet('設定', body, foot, sh => {
    const catsEl = $('#stCats', sh);
    $('#stCatAdd', sh).addEventListener('click', () => { catsEl.insertAdjacentHTML('beforeend', crow({ name: '', req: 0 })); $('.crow:last-child .cn', catsEl).focus(); });
    catsEl.addEventListener('click', e => { const b = e.target.closest('.x'); if (b) b.closest('.crow').remove(); });
    $('#stSave', sh).addEventListener('click', () => {
      const nr = QUARTERS.map(() => ({ s: '', e: '' }));
      $$('input[type=date]', sh).forEach(i => { nr[+i.dataset.i][i.dataset.k] = i.value; });
      const req = parseFloat($('#stReq', sh).value);
      if (!(req > 0)) { toast('卒業要件単位を正しく入力してください'); return; }
      S.ranges = nr;
      S.entryYear = +$('#stEntry', sh).value;
      S.entrySet = true;
      S.years = +$('#stYears', sh).value;
      S.required = req;
      S.scale = $('#stScale', sh).value;
      S.cats = $$('.crow', catsEl).map(r => ({ name: $('.cn', r).value.trim(), req: Math.max(0, parseFloat($('.cr', r).value) || 0) })).filter(x => x.name);
      const cq = quarterByDate();
      if (cq) state.ui.q = cq;
      save(); closeSheet(); render(); toast('設定を保存しました');
    });
    armButton($('#stWipe', sh), `${ICON.trash}もう一度押すと全削除`, () => {
      state.courses = [];
      save(); closeSheet(); render(); toast('すべての授業を削除しました');
    });
  });
}

/* ===== events ===== */
document.addEventListener('click', e => {
  if (e.target.closest('#sheet')) return;
  if (e.target.closest('#goSettings')) { openSettings(); return; }
  const t = e.target.closest('[data-q],[data-y],[data-view],[data-filter],[data-goyear],[data-open],[data-add]');
  if (!t) return;
  const d = t.dataset;
  if (d.q) { state.ui.q = +d.q; save(); render(); }
  else if (d.y) { state.ui.y = +d.y; save(); render(); }
  else if (d.view) { state.ui.view = d.view; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (d.filter) { state.ui.filter = d.filter; save(); render(); }
  else if (d.goyear) { state.ui.y = +d.goyear; state.ui.view = 'list'; state.ui.filter = 'year'; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (d.open) openDetail(d.open);
  else if (d.add !== undefined) {
    const [dd, p] = d.add.split('-').map(Number);
    openForm(null, d.add ? { d: dd, p } : null);
  }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'lsearch') return;
  search = e.target.value;
  $('#lres').innerHTML = listResultsHTML();
});
$('#btnAdd').addEventListener('click', () => openForm(null));
$('#btnShare').addEventListener('click', openShare);
$('#btnSettings').addEventListener('click', openSettings);
window.addEventListener('hashchange', checkHash);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#sheet').classList.contains('open') && document.activeElement.id !== 'lsearch') render(); });
setInterval(() => {
  if (document.hidden || $('#sheet').classList.contains('open')) return;
  if (state.ui.view === 'grid') { renderNow(); $('#view').innerHTML = gridHTML(state.ui.y, state.ui.q, false); }
  else if (state.ui.view === 'list' && state.ui.filter === 'term') renderNow();
}, 30000);

/* ===== boot ===== */
{
  if (yearsList().includes(acadYear())) state.ui.y = acadYear();
  const cq = quarterByDate();
  if (cq) state.ui.q = cq;
  render();
  checkHash();
}
</script>
</body>

<style>
  :root{
    --bg:#07080c; --bg-2:#0c0e15;
    --panel:rgba(255,255,255,.035); --panel-2:rgba(255,255,255,.065); --panel-solid:#10121a;
    --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.14);
    --fg:#eceef6; --mute:#9097ab; --dim:#5b6174;
    --accent:#8b7cff; --accent-2:#3de0d0; --warn:#ffb547; --danger:#ff5d73;
    --radius:16px; --radius-s:10px;
    --font: "Inter","SF Pro Display",system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
    --mono: "SF Mono","JetBrains Mono","Cascadia Mono",ui-monospace,Menlo,Consolas,monospace;
    --bar-h: 76px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;text-size-adjust:100%;overscroll-behavior-x:none}   /* 横スワイプでクォーターや曜日を切り替えるので、ブラウザの「戻る／進む」ジェスチャーに奪わせない */
  body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
  body.lock{overflow:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(60vmax 45vmax at 8% -8%, rgba(139,124,255,.20), transparent 60%),
      radial-gradient(50vmax 40vmax at 105% 110%, rgba(61,224,208,.13), transparent 60%),
      radial-gradient(40vmax 30vmax at 80% 10%, rgba(255,93,160,.06), transparent 60%),
      var(--bg)}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%)}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none;padding:0}
  .ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  .wrap{max-width:1120px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}

  /* ---------- header ---------- */
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:max(18px,env(safe-area-inset-top));padding-bottom:14px}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.32em;color:var(--mute);text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 10px var(--accent-2)}
  h1{margin:6px 0 0;font-size:clamp(26px,6vw,38px);font-weight:750;letter-spacing:-.02em;line-height:1;display:flex;align-items:baseline;gap:12px}
  h1 .qbig{font-family:var(--mono);font-weight:600;font-size:.62em;letter-spacing:.02em;
    background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .actions{display:flex;gap:8px}
  .iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--fg);transition:background .2s,border-color .2s,transform .15s}
  .iconbtn:hover{background:var(--panel-2);border-color:var(--line-2)}
  .iconbtn:active{transform:scale(.94)}

  /* ---------- quarter tabs ---------- */
  .qtabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);padding:4px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .qtabs .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);border-radius:10px;
    background:linear-gradient(135deg,rgba(139,124,255,.28),rgba(61,224,208,.16));border:1px solid rgba(139,124,255,.45);
    box-shadow:0 0 24px -6px rgba(139,124,255,.6), inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .38s cubic-bezier(.2,.9,.25,1)}
  .qtab{position:relative;z-index:1;height:42px;border-radius:10px;font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.06em;color:var(--mute);transition:color .25s;display:flex;align-items:center;justify-content:center;gap:6px}
  .qtab.on{color:var(--fg)}
  .qtab .cur{width:5px;height:5px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 8px var(--accent-2)}
  .qtab .cnt{font-size:10px;color:var(--dim);font-weight:500}
  .qtab.on .cnt{color:var(--mute)}

  /* ---------- now card ---------- */
  #now{margin:14px 0 0}
  .nowcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer;width:100%;text-align:left;transition:border-color .2s}
  .nowcard:hover{border-color:var(--line-2)}
  .nowcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--accent));box-shadow:0 0 18px var(--c,var(--accent))}
  .nowcard.idle{cursor:default}
  .nowcard .when{flex:none;min-width:74px}
  .nowcard .lab{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--mute);display:flex;align-items:center;gap:6px;text-transform:uppercase}
  .nowcard .lab i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 8px var(--c,var(--accent))}
  .nowcard.live .lab i{animation:pulse 1.6s ease-in-out infinite}
  .nowcard .big{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
  .nowcard .what{min-width:0;flex:1}
  .nowcard .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nowcard .sub{font-size:12.5px;color:var(--mute);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
  .nowcard .sub span{display:inline-flex;align-items:center;gap:4px}
  .nowcard .sub .ic{width:13px;height:13px}
  .nowcard .rem{flex:none;font-family:var(--mono);font-size:11px;color:var(--mute);text-align:right}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

  main{padding:16px 0 calc(var(--bar-h) + 40px + env(safe-area-inset-bottom))}

  /* ---------- timetable grid ---------- */
  .tt{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:5px}
  .dh{text-align:center;padding:6px 0 8px;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.08em;position:relative}
  .dh small{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.18em;margin-top:2px;font-weight:500}
  .dh.today{color:var(--fg)}
  .dh.today::after{content:"";position:absolute;left:50%;bottom:0;width:18px;height:2px;margin-left:-9px;border-radius:2px;background:var(--accent-2);box-shadow:0 0 10px var(--accent-2)}
  .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:var(--radius-s);min-height:92px}
  .ph b{font-family:var(--mono);font-size:18px;font-weight:600;line-height:1}
  .ph span{font-family:var(--mono);font-size:9px;color:var(--dim);line-height:1.25;text-align:center}
  .ph.now b{color:var(--accent-2);text-shadow:0 0 12px rgba(61,224,208,.7)}
  .cell{min-height:92px;border-radius:var(--radius-s);background:rgba(255,255,255,.018);border:1px dashed rgba(255,255,255,.06);display:flex;flex-direction:column;gap:4px;padding:3px;position:relative;min-width:0}
  .cell.todaycol{background:rgba(61,224,208,.035)}
  .cell.empty{align-items:center;justify-content:center;color:transparent;transition:color .2s,background .2s,border-color .2s}
  .cell.empty .ic{width:18px;height:18px}
  .cell.empty:hover{color:var(--mute);background:rgba(255,255,255,.04);border-color:var(--line-2)}
  @media (hover:none){.cell.empty{color:rgba(255,255,255,.08)}}
  .cell.filled{border-style:solid;border-color:transparent;background:none;padding:0}
  .cell.now{box-shadow:0 0 0 1.5px var(--accent-2),0 0 22px -4px rgba(61,224,208,.6)}
  .chip{flex:1;min-height:0;width:100%;text-align:left;border-radius:var(--radius-s);padding:8px 7px;display:flex;flex-direction:column;gap:4px;
    background:linear-gradient(165deg,var(--c1),var(--c2));border:1px solid var(--c3);position:relative;overflow:hidden;
    box-shadow:0 10px 26px -16px var(--c),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .15s,box-shadow .2s}
  .chip::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:0 2px 2px 0;background:var(--c);box-shadow:0 0 10px var(--c)}
  .chip:hover{box-shadow:0 12px 30px -12px var(--c),inset 0 1px 0 rgba(255,255,255,.1)}
  .chip:active{transform:scale(.97)}
  .chip .n{font-size:11px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
  .chip .r{font-size:9.5px;color:var(--mute);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto}
  .chip .t{display:none;font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.dup .n{-webkit-line-clamp:1}
  .chip .dupb{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .lunch{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--dim);padding:4px 2px}
  .lunch::before,.lunch::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line-2),transparent)}

  @media (min-width:720px){
    .tt{grid-template-columns:70px repeat(5,minmax(0,1fr));gap:8px}
    .ph,.cell{min-height:112px}
    .ph span{font-size:10.5px}
    .chip{padding:12px 12px;gap:6px}
    .chip .n{font-size:13.5px}
    .chip .r{font-size:11.5px}
    .chip .t{display:block}
    .dh{font-size:13px}
  }

  /* ---------- list view ---------- */
  .list{display:grid;grid-template-columns:1fr;gap:12px}
  @media (min-width:760px){.list{grid-template-columns:1fr 1fr}}
  .card{position:relative;text-align:left;width:100%;border-radius:var(--radius);padding:16px 16px 16px 20px;background:var(--panel);border:1px solid var(--line);overflow:hidden;transition:border-color .2s,transform .15s;display:flex;flex-direction:column;gap:12px}
  .card:hover{border-color:var(--line-2)}
  .card:active{transform:scale(.99)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);box-shadow:0 0 16px var(--c)}
  .card::after{content:"";position:absolute;right:-60px;top:-60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--c2),transparent 70%);pointer-events:none}
  .card h3{margin:0;font-size:16.5px;font-weight:750;letter-spacing:-.01em;line-height:1.35}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--fg);white-space:nowrap}
  .tag.c{background:var(--c2);border-color:var(--c3)}
  .tag.q{color:var(--mute)}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
  .mi{display:flex;gap:8px;align-items:flex-start;font-size:13px;min-width:0}
  .mi .ic{width:15px;height:15px;color:var(--dim);margin-top:2px}
  .mi .k{font-size:10px;color:var(--dim);letter-spacing:.12em;font-family:var(--mono);display:block;margin-bottom:1px}
  .mi .v{word-break:break-word;white-space:pre-wrap;line-height:1.45}
  .mi.full{grid-column:1/-1}
  .v.none{color:var(--dim)}

  .ebar{display:flex;height:8px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.05);gap:2px}
  .ebar i{display:block;height:100%}
  .elegend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px}
  .elegend span{display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
  .elegend b{font-family:var(--mono);font-weight:600}
  .elegend i{width:8px;height:8px;border-radius:2px;flex:none}
  .enote{font-size:12.5px;color:var(--mute);margin-top:8px;white-space:pre-wrap;line-height:1.55}

  .empty-state{padding:56px 20px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--radius);color:var(--mute)}
  .empty-state b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}
  .empty-state p{margin:0 0 18px;font-size:13px;line-height:1.7}

  /* ---------- bottom bar ---------- */
  .bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;
    width:min(520px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr) auto;gap:4px;align-items:center;padding:6px;border-radius:22px;
    background:rgba(16,18,26,.72);border:1px solid var(--line-2);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}
  .bar .seg{height:52px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;letter-spacing:.04em;font-weight:600;color:var(--mute);transition:color .2s,background .2s}
  .bar .seg.on{color:var(--fg);background:rgba(255,255,255,.07)}
  .bar .add{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,var(--accent),#5b8cff 55%,var(--accent-2));box-shadow:0 8px 28px -6px rgba(139,124,255,.8),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s}
  .bar .add:active{transform:scale(.92)}
  .bar .add .ic{width:24px;height:24px;stroke-width:2.2}

  /* ---------- sheet ---------- */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(3,4,8,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .28s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#141722,#0d0f16);border:1px solid var(--line-2);border-bottom:none;border-radius:22px 22px 0 0;
    box-shadow:0 -30px 80px -30px rgba(0,0,0,.9);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.25,1);visibility:hidden}
  .sheet.open{transform:none;visibility:visible}
  .sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:10px auto 0;flex:none}
  @media (min-width:720px){
    .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(640px,calc(100% - 48px));max-height:86vh;border-radius:22px;border-bottom:1px solid var(--line-2);
      transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.25,1),opacity .25s}
    .sheet.open{transform:translate(-50%,-50%);opacity:1}
    .sheet .grab{display:none}
  }
  .sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 10px;flex:none}
  .sh-head h2{margin:0;font-size:17px;font-weight:700}
  .sh-body{padding:4px 20px 20px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1}
  .sh-foot{display:flex;gap:10px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none;background:rgba(10,12,18,.6)}
  .sh-foot .spacer{flex:1}
  .btn{height:48px;padding:0 20px;border-radius:13px;font-weight:650;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel-2);border:1px solid var(--line-2);transition:background .2s,transform .12s,border-color .2s}
  .btn:hover{background:rgba(255,255,255,.1)}
  .btn:active{transform:scale(.97)}
  .btn.pri{background:linear-gradient(135deg,var(--accent),#5b8cff);border-color:transparent;color:#fff;box-shadow:0 8px 24px -10px rgba(139,124,255,.9)}
  .btn.danger{color:var(--danger);border-color:rgba(255,93,115,.35);background:rgba(255,93,115,.08)}
  .btn.danger.armed{background:var(--danger);color:#fff;border-color:transparent}
  .btn.wide{flex:1}
  .btn .ic{width:17px;height:17px}

  /* ---------- form ---------- */
  .fg{margin-top:18px}
  .fg>label,.fl{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--mute);margin-bottom:8px;text-transform:uppercase}
  .fl .req{color:var(--accent-2)}
  .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .row2>.fg{min-width:0}
  .row2 .fg{margin-top:18px}
  input[type=text],input[type=url],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],textarea{width:100%;font-size:16px;padding:12px 13px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line-2);outline:none;transition:border-color .2s,box-shadow .2s,background .2s;color-scheme:dark}
  textarea{resize:vertical;min-height:76px;line-height:1.5}
  input:focus,textarea:focus{border-color:rgba(139,124,255,.7);box-shadow:0 0 0 3px rgba(139,124,255,.18);background:rgba(255,255,255,.06)}
  input.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(255,93,115,.18)}
  ::placeholder{color:var(--dim)}
  .toggles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tg{height:44px;border-radius:11px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);font-family:var(--mono);font-weight:600;font-size:13.5px;color:var(--mute);transition:all .18s}
  .tg.on{color:#fff;background:linear-gradient(135deg,rgba(139,124,255,.45),rgba(91,140,255,.3));border-color:rgba(139,124,255,.8);box-shadow:0 0 18px -6px rgba(139,124,255,.8)}
  .slots{display:grid;grid-template-columns:30px repeat(5,1fr);gap:5px}
  .slots .sh{font-size:11px;color:var(--mute);text-align:center;padding-bottom:2px}
  .slots .sp{font-family:var(--mono);font-size:12px;color:var(--mute);display:grid;place-items:center}
  .slot{height:40px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.025);transition:all .15s;position:relative}
  .slot.on{background:linear-gradient(135deg,rgba(61,224,208,.4),rgba(139,124,255,.35));border-color:rgba(61,224,208,.8);box-shadow:0 0 14px -4px rgba(61,224,208,.8)}
  .slot.on::after{content:"";position:absolute;inset:0;margin:auto;width:8px;height:8px;border-radius:50%;background:#fff}
  .slot.busy:not(.on)::before{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--dim)}
  .hint{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.6}
  .hint.warn{color:var(--warn)}
  .erow{display:grid;grid-template-columns:1fr 92px 40px;gap:8px;margin-bottom:8px;align-items:center}
  .erow .pct{position:relative}
  .erow .pct input{padding-right:26px;text-align:right}
  .erow .pct::after{content:"%";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:13px;pointer-events:none}
  .erow .x{height:44px;border-radius:10px;display:grid;place-items:center;color:var(--dim)}
  .erow .x:hover{color:var(--danger);background:rgba(255,93,115,.08)}
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .pre{font-size:12.5px;padding:7px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--mute);background:rgba(255,255,255,.03)}
  .pre:hover{color:var(--fg);border-color:rgba(139,124,255,.6)}
  .etotal{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mute);margin-top:4px}
  .etotal b{font-family:var(--mono);font-size:14px;color:var(--fg)}
  .etotal b.bad{color:var(--warn)}
  .etotal b.ok{color:var(--accent-2)}
  .linkbtn{font-size:13px;color:var(--accent);padding:8px 0;font-weight:600}
  .swatches{display:flex;flex-wrap:wrap;gap:10px}
  .sw{width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:0 0 14px -3px var(--c);border:2px solid transparent;outline:2px solid transparent;outline-offset:2px;transition:outline-color .15s,transform .15s}
  .sw.on{outline-color:#fff;transform:scale(1.06)}

  /* ---------- detail ---------- */
  .dt-hero{position:relative;border-radius:var(--radius);padding:18px;background:linear-gradient(150deg,var(--c1),var(--c2) 70%);border:1px solid var(--c3);overflow:hidden}
  .dt-hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--c1),transparent 70%)}
  .dt-hero h3{margin:0 0 12px;font-size:21px;line-height:1.3;letter-spacing:-.01em;font-weight:780;position:relative;z-index:1}
  .dt-hero .tags{position:relative;z-index:1}
  .dsec{margin-top:18px;padding:16px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line)}
  .dsec h4{margin:0 0 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--mute);font-weight:500;display:flex;align-items:center;gap:8px;text-transform:uppercase}
  .dsec h4 .ic{width:14px;height:14px}
  .dsec .body{font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .dsec a{color:var(--accent-2);word-break:break-all}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .dgrid .dsec{margin-top:0}
  .dgrid .dsec .body{font-size:15px;font-weight:600}
  .dgrid .full{grid-column:1/-1}

  /* ---------- share/settings ---------- */
  .sharebox{display:flex;gap:8px}
  .sharebox input{font-family:var(--mono);font-size:12.5px}
  .stack{display:flex;flex-direction:column;gap:10px}
  .qrange{display:grid;grid-template-columns:26px minmax(0,1fr) 10px minmax(0,1fr);gap:6px;align-items:center;margin-bottom:10px}
  .qrange b{font-family:var(--mono);font-size:13px;color:var(--mute)}
  .qrange span{color:var(--dim);text-align:center}
  .qrange input{min-width:0;width:100%;height:44px;padding:0 8px;font-size:14px;-webkit-appearance:none;appearance:none}
  .divider{height:1px;background:var(--line);margin:22px 0 4px}
  .about{font-size:12px;color:var(--dim);line-height:1.8;margin-top:18px}

  /* ---------- year tabs ---------- */
  #tabs{display:flex;flex-direction:column;gap:8px}
  #tabs.hide{display:none}
  .qtabs.hide{display:none}
  .ytabs{grid-template-columns:repeat(var(--n),1fr)}
  .ytabs .ind{width:calc((100% - 8px)/var(--n))}
  .ytabs .qtab{height:48px;flex-direction:column;gap:2px;font-family:var(--font);font-size:14px;letter-spacing:.02em}
  .ytabs .qtab small{font-family:var(--mono);font-size:9.5px;color:var(--dim);font-weight:500;letter-spacing:.08em;display:flex;align-items:center;gap:5px}
  .ytabs .qtab.on small{color:var(--mute)}

  /* ---------- list filters / rows ---------- */
  .filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  .fchip{height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;font-weight:600;color:var(--mute);background:rgba(255,255,255,.03);transition:all .18s}
  .fchip.on{color:#fff;background:rgba(139,124,255,.22);border-color:rgba(139,124,255,.7);box-shadow:0 0 16px -6px rgba(139,124,255,.8)}
  .search{flex:1 1 200px;min-width:0}
  .search input{height:40px;padding:8px 16px;border-radius:999px}
  .rows{display:flex;flex-direction:column;gap:6px}
  .row{display:grid;grid-template-columns:8px minmax(0,1fr) auto 44px;gap:12px;align-items:center;padding:12px 12px 12px 14px;border-radius:13px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%;transition:border-color .2s,background .2s}
  .row:hover{border-color:var(--line-2);background:var(--panel-2)}
  .row .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
  .rn{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rs{font-size:11.5px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rc{font-family:var(--mono);font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
  .rc small{font-size:10px;color:var(--dim);margin-left:2px;font-family:var(--font);font-weight:500}
  .gbadge{min-width:44px;height:32px;padding:0 6px;border-radius:9px;display:grid;place-items:center;font-weight:750;font-size:13.5px;border:1px solid;white-space:nowrap}
  .gbadge.pend{font-size:10.5px;font-weight:600;border-style:dashed}
  .ghead{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px;flex-wrap:wrap}
  .ghead:first-child{margin-top:4px}
  .ghead b{font-size:18px;font-weight:750;letter-spacing:-.01em}

  /* ---------- toast ---------- */

    padding:11px 16px;border-radius:12px;background:rgba(22,25,36,.95);border:1px solid var(--line-2);font-size:13.5px;box-shadow:0 12px 30px -10px #000;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}

  /* ---------- touch ---------- */

  .vdate{flex:1;text-align:right;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--mute)}
  .dchips{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;min-width:0}
  .dchip{height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.025);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mute);transition:background .2s,border-color .2s}
  .dchip b{font-size:13px;font-weight:700;line-height:1}
  .dchip small{font-family:var(--mono);font-size:10px;line-height:1}
  .dchip.today b{color:var(--accent-2)}
  .dchip.on{color:var(--fg);background:linear-gradient(135deg,rgba(139,124,255,.28),rgba(61,224,208,.16));border-color:rgba(139,124,255,.6)}
  .dayhead{display:flex;align-items:baseline;gap:10px;margin:2px 2px 12px}
  .dayhead b{font-size:19px;font-weight:750;letter-spacing:-.01em}
  .dayhead span{font-family:var(--mono);font-size:12px;color:var(--mute)}
  .dayhead em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:3px 7px;border-radius:6px;background:rgba(61,224,208,.14);color:var(--accent-2)}
  .dayhead .sp{flex:1}
  .dlist{display:flex;flex-direction:column;gap:8px}
  .drow{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:stretch}
  .drow .dt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--mono)}
  .drow .dt b{font-size:20px;font-weight:600;line-height:1}
  .drow .dt span{font-size:10px;color:var(--dim);text-align:center;line-height:1.25}
  .drow.now .dt b{color:var(--accent-2);text-shadow:0 0 12px rgba(61,224,208,.7)}
  .drow.gone{opacity:.5}
  .dcs{display:flex;flex-direction:column;gap:6px;min-width:0}
  .dcard{position:relative;width:100%;text-align:left;border-radius:14px;padding:14px 14px 14px 19px;background:linear-gradient(165deg,var(--c1),var(--c2));border:1px solid var(--c3);display:flex;flex-direction:column;gap:7px;overflow:hidden;box-shadow:0 10px 26px -18px var(--c);transition:transform .15s}
  .dcard:active{transform:scale(.985)}
  .dcard::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--c);box-shadow:0 0 10px var(--c)}
  .drow.now .dcard{box-shadow:0 0 0 1.5px var(--accent-2),0 0 22px -4px rgba(61,224,208,.6)}
  .dcard .n{font-size:16.5px;font-weight:750;line-height:1.3;word-break:break-all}
  .dcard .m{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mute)}
  .dcard .m span{display:inline-flex;align-items:center;gap:5px}
  .dcard .m .ic{width:14px;height:14px}
  .dcard .tags .tag{font-size:11.5px}
  .dempty{width:100%;min-height:48px;border-radius:14px;border:1px dashed rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-size:12.5px}
  .dempty .ic{width:16px;height:16px}

  /* ---------- requirement diagram / category ---------- */
  .rq-eq{font-size:13px;color:var(--mute);margin:-4px 0 14px;line-height:1.7}
  .rq-eq b{font-family:var(--mono);font-size:15px;color:var(--fg)}
  .ice{display:flex;flex-direction:column;gap:4px;margin:0 0 16px}
  .ice-row{display:flex;gap:4px}
  .ice-row .slot2{display:flex;gap:3px;min-width:0}
  .seg{position:relative;min-width:0;height:46px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.045);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;text-align:center}
  .ice-row.sub .seg{height:36px;border-radius:7px}
  .seg .e{position:absolute;left:0;top:0;bottom:0;background:var(--c);opacity:.9;box-shadow:0 0 14px var(--c)}
  .seg .p{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 6px);opacity:.55}
  .seg span{position:relative;z-index:1;display:flex;flex-direction:column;line-height:1.15;padding:0 3px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .seg b{font-size:12.5px;font-weight:750;white-space:nowrap}
  .seg small{font-size:10.5px;font-family:var(--mono)}
  .yrow.rq{grid-template-columns:112px minmax(0,1fr) 46px;gap:12px;padding:12px 12px 12px 13px;border-left:3px solid var(--c)}
  .yrow.rq b{font-size:13.5px;line-height:1.35}
  .yrow.rq.grp{background:var(--panel-2);border-color:var(--c3);border-left-color:var(--c)}
  .yrow.rq .sbar .e{background:var(--c);box-shadow:0 0 10px var(--c)}
  .yrow.rq .sbar .p{background:repeating-linear-gradient(135deg,var(--c3) 0 4px,var(--c1) 4px 8px)}
  .rq-kids{margin:8px 0 0 10px;padding-left:10px;border-left:2px solid var(--line-2);display:flex;flex-direction:column;gap:8px}
  .rq-g{margin-bottom:2px}
  .cgrp{margin-bottom:14px}
  .cgrp .cl{display:flex;align-items:baseline;gap:8px;font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:8px}
  .cgrp .cl em{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--dim)}
  .cchips{display:flex;flex-wrap:wrap;gap:8px}
  .cc{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);font-size:13.5px;font-weight:650;color:var(--mute);transition:all .15s;text-align:left}
  .cc.on{color:#fff;background:linear-gradient(135deg,rgba(139,124,255,.45),rgba(91,140,255,.3));border-color:rgba(139,124,255,.8);box-shadow:0 0 18px -6px rgba(139,124,255,.8)}
  .cblk{margin-bottom:12px;padding:8px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
  .cblk .crow.top .cn{font-weight:700}
  .ckids{margin:8px 0 0 6px;padding-left:8px;border-left:2px solid var(--line-2)}
  .crow{grid-template-columns:minmax(0,1fr) 62px 38px;gap:6px}
  .crow input{padding:12px 10px}
  .crow .cr{text-align:right}
  .crow .x{width:38px}

  input[type=date],input[type=time]{min-width:0;min-height:48px;-webkit-appearance:none;appearance:none;line-height:1.2}

  /* ---------- promotion ---------- */
  .pm{border-radius:20px;border:1px solid var(--line);background:var(--panel);padding:18px 16px}
  .pm-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .pm-title{font-size:16px;font-weight:750;letter-spacing:-.01em}
  .pm-sub{font-size:12.5px;color:var(--mute);margin-top:5px;line-height:1.5}
  .pm-badge{flex:none;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.1em;padding:6px 11px;border-radius:9px;border:1px solid}
  .pm-badge.ok{color:var(--accent-2);border-color:rgba(61,224,208,.55);background:rgba(61,224,208,.1);box-shadow:0 0 16px -4px rgba(61,224,208,.6)}
  .pm-badge.soon{color:#b8aeff;border-color:rgba(139,124,255,.55);background:rgba(139,124,255,.12)}
  .pm-badge.ng{color:var(--warn);border-color:rgba(255,181,71,.5);background:rgba(255,181,71,.08)}
  .pm-block{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .pm-block>h4{margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:700}
  .pm-block>h4 em{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--mute)}
  .pm-big{display:flex;align-items:baseline;gap:8px}
  .pm-big b{font-size:34px;font-weight:600;font-family:var(--mono);line-height:1;letter-spacing:-.02em}
  .pm-big span{font-size:14px;color:var(--mute);font-family:var(--mono)}
  .pm-big small{margin-left:auto;font-size:11.5px;color:var(--mute)}
  .pm-rows{display:flex;flex-direction:column;gap:6px}
  .pm-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:11px;align-items:center;min-height:56px;padding:9px 11px 9px 13px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.025);width:100%;text-align:left;transition:border-color .2s}
  .pm-row:hover{border-color:var(--line-2)}
  .pm-dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .pm-t{min-width:0}
  .pm-t b{display:block;font-size:14px;font-weight:700}
  .pm-t small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pm-st{font-family:var(--mono);font-size:11px;font-weight:700;padding:4px 8px;border-radius:7px;border:1px solid var(--line-2);color:var(--dim);white-space:nowrap}
  .pm-row.ok .pm-dot{background:var(--accent-2);box-shadow:0 0 8px var(--accent-2)}
  .pm-row.ok .pm-st{color:var(--accent-2);border-color:rgba(61,224,208,.5);background:rgba(61,224,208,.08)}
  .pm-row.part .pm-dot,.pm-row.plan .pm-dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .pm-row.part .pm-st,.pm-row.plan .pm-st{color:#b8aeff;border-color:rgba(139,124,255,.5);background:rgba(139,124,255,.1)}
  .pm-row.fail .pm-dot{background:var(--danger)}
  .pm-row.fail .pm-st{color:var(--danger);border-color:rgba(255,93,115,.45);background:rgba(255,93,115,.08)}
  .pm-row.none{border-style:dashed}
  .pm-cond{margin-top:12px;padding:13px;border-radius:14px;border:1px solid rgba(255,181,71,.3);background:rgba(255,181,71,.05)}
  .pm-ch{display:flex;flex-direction:column;gap:3px}
  .pm-ch b{font-size:14px}
  .pm-ch span{font-size:12px;color:var(--mute)}
  .pm-score{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;margin-top:10px}
  .pm-score input{padding:10px 12px;font-size:16px;text-align:right}
  .pm-score span{font-family:var(--mono);font-size:13px;color:var(--mute)}
  .pm-score b{font-size:13px;color:var(--warn);min-width:62px;text-align:right}
  .pm-score b.ok{color:var(--accent-2)}
  .pm-act{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:12px;color:var(--mute)}
  .pm .sbar .e{background:var(--accent-2)}

  /* ---------- grades ---------- */
  .gb{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;flex:1 1 0;min-width:50px;padding:0 6px;line-height:1.1}
  .gb b{font-size:16px;font-weight:800}
  .gb small{font-size:10px;font-weight:600;opacity:.75}
  .gb.sm{flex-direction:row;height:44px;font-size:12.5px}
  .gbr{flex-basis:100%;height:0}
  .gscore{display:flex;align-items:center;gap:10px;margin-top:14px}
  .gscore label{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--mute);margin:0}
  .gscore input{width:104px;padding:10px 12px;text-align:right}
  .gscore span{color:var(--mute);font-size:13px}
  .gtab{border-radius:14px;border:1px solid var(--line);overflow:hidden}
  .gr{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.2fr) 40px 54px;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:13px}
  .gr:first-child{border-top:0}
  .gr.gh{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);background:rgba(255,255,255,.03)}
  .gr i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px}
  .gr .p{color:var(--accent-2);font-weight:700}
  .gr .f{color:var(--danger);font-weight:700}
  .pm-chips{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 6px 6px;padding:10px 10px 8px;border-radius:0 0 13px 13px;border:1px solid var(--line);border-top:0;background:rgba(255,255,255,.015)}
  .pm-chips>span{flex-basis:100%;font-size:11px;color:var(--dim)}
  .pm-chip{min-height:40px;padding:0 12px;border-radius:10px;border:1px dashed var(--line-2);font-size:12.5px;font-weight:650;color:var(--dim)}
  .pm-chip.ok{border-style:solid;color:var(--accent-2);border-color:rgba(61,224,208,.5);background:rgba(61,224,208,.08)}
  .pm-chip.plan{border-style:solid;color:#b8aeff;border-color:rgba(139,124,255,.5);background:rgba(139,124,255,.1)}
  .pm-chip.fail{border-style:solid;color:var(--danger);border-color:rgba(255,93,115,.45);background:rgba(255,93,115,.08)}

  /* ---------- academic calendar ---------- */
  .cbn{display:block;padding:8px 12px;border-radius:12px;font-size:12.5px;line-height:1.5;margin-bottom:6px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:var(--fg)}
  .cbn small{display:block;color:var(--mute);font-size:11.5px;margin-top:1px}
  .cbn.off{border-color:rgba(255,93,115,.35);background:rgba(255,93,115,.07)}
  .cbn.swap{border-color:rgba(255,181,71,.45);background:rgba(255,181,71,.07)}
  .cbn.exam{border-color:rgba(139,124,255,.5);background:rgba(139,124,255,.1)}
  .cbn.reg{border-color:rgba(61,224,208,.4);background:rgba(61,224,208,.07)}
  .cbn.vac{color:var(--mute)}
  .wnotes{margin:-2px 0 10px}
  .wnotes .cbn{margin-bottom:4px}
  .chip.examw{outline:1.5px dashed rgba(139,124,255,.9);outline-offset:-1.5px}
  .chip.examw::after{content:"試験";position:absolute;top:3px;right:3px;font-size:8.5px;font-weight:800;padding:1px 4px;border-radius:4px;background:rgba(139,124,255,.95);color:#fff;line-height:1.3}
  .dcard.exw{outline:1.5px dashed rgba(139,124,255,.8);outline-offset:-1.5px}
  .dayhead em.off{background:rgba(255,93,115,.14);color:#ff9aa8;letter-spacing:.04em}
  .dayhead em.sw{background:rgba(255,181,71,.14);color:var(--warn);letter-spacing:.04em}
  .ctabs{display:flex;justify-content:center;margin:2px 0 14px}
  .cnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cnav b{font-size:17px;font-weight:750}
  .cnav button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:22px;line-height:1;color:var(--fg)}
  .cwk,.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .cwk span{text-align:center;font-size:11px;color:var(--mute);padding:3px 0}
  .cwk span:first-child{color:#ff9aa8}
  .cwk span:last-child{color:#8fb7ff}
  .cc2{position:relative;height:54px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;transition:border-color .15s}
  .cc2 b{font-family:var(--mono);font-size:15px;font-weight:600;line-height:1}
  .cc2 small{font-size:9px;font-weight:700;line-height:1;color:var(--mute);white-space:nowrap}
  .cc2.off{background:rgba(255,255,255,.012);border-color:transparent;color:var(--dim)}
  .cc2.off b{opacity:.55}
  .cc2.sun b{color:#ff9aa8}
  .cc2.sat b{color:#8fb7ff}
  .cc2.k-holiday b{color:#ff9aa8;opacity:1}
  .cc2.k-vac{background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 4px,transparent 4px 8px)}
  .cc2.ex{background:rgba(139,124,255,.13);border-color:rgba(139,124,255,.45)}
  .cc2 small.x{color:#b8aeff}
  .cc2 small.r{color:var(--accent-2)}
  .cc2.k-swap{background:rgba(255,181,71,.08);border-color:rgba(255,181,71,.55)}
  .cc2.k-swap small{color:var(--warn)}
  .cc2.k-cancel small{color:var(--danger)}
  .cc2.today{box-shadow:0 0 0 1.5px var(--accent-2)}
  .cc2.sel{border-color:#fff}
  .cdet{margin-top:16px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
  .cdh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .cdh b{font-size:17px;margin-right:2px}
  .cs{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;border:1px solid var(--line-2);color:var(--mute);white-space:nowrap}
  .cs.ok{color:var(--accent-2);border-color:rgba(61,224,208,.5);background:rgba(61,224,208,.08)}
  .cs.off{color:#ff9aa8;border-color:rgba(255,93,115,.4);background:rgba(255,93,115,.07)}
  .cs.soon{color:var(--warn);border-color:rgba(255,181,71,.45)}
  .cs.exm{color:#b8aeff;border-color:rgba(139,124,255,.5);background:rgba(139,124,255,.1)}
  .cs.past{color:var(--dim)}
  .cdl{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .cday{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:52px;padding:8px 12px 8px 10px;border-radius:12px;border:1px solid var(--c3);background:linear-gradient(165deg,var(--c1),var(--c2));text-align:left;width:100%}
  .cday>i{font-style:normal;font-family:var(--mono);font-weight:600;font-size:17px;text-align:center}
  .cday b{display:block;font-size:14px;font-weight:700}
  .cday small{display:block;font-size:11.5px;color:var(--mute);margin-top:1px}
  .cday.exw{border-style:dashed}
  .schs{display:flex;flex-direction:column;gap:6px}
  .sch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
  .sch b{display:block;font-size:13.5px;font-weight:700}
  .sch small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}

  /* ---------- account / sync ---------- */
  .iconbtn{position:relative}
  .sdot{position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg);background:var(--dim)}
  .sdot[hidden]{display:none}
  .sdot.ok{background:var(--accent-2);box-shadow:0 0 8px var(--accent-2)}
  .sdot.busy{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
  .sdot.warn{background:var(--warn)}
  .sdot.err{background:var(--danger)}
  #syncbar{margin-top:10px}
  #syncbar:empty{display:none}
  .cbn-btn{width:100%;text-align:left;cursor:pointer}
  .acct-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .acct-h b{font-size:15px;word-break:break-all}
  .pill{display:inline-flex;align-items:center;gap:6px;flex:none;font-family:var(--mono);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--mute);white-space:nowrap}
  .pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill.ok{color:var(--accent-2);border-color:rgba(61,224,208,.5);background:rgba(61,224,208,.08)}
  .pill.busy{color:#b8aeff;border-color:rgba(139,124,255,.5)}
  .pill.warn{color:var(--warn);border-color:rgba(255,181,71,.5);background:rgba(255,181,71,.08)}
  .pill.err{color:var(--danger);border-color:rgba(255,93,115,.45);background:rgba(255,93,115,.08)}
  .note{padding:14px;border-radius:14px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);font-size:13px;line-height:1.6;margin-top:12px}
  .note p{margin:6px 0 0}
  .warn-box{border-color:rgba(255,181,71,.4);background:rgba(255,181,71,.06)}
  .okmsg{color:var(--accent-2)}
  .acct-links{margin-top:2px}
  details.cfg{margin-top:16px;border-top:1px solid var(--line);padding-top:2px}
  details.cfg summary{cursor:pointer;list-style:none;font-size:12.5px;color:var(--mute);min-height:44px;display:flex;align-items:center}
  details.cfg summary::-webkit-details-marker{display:none}

  /* ---------- phone (primary target) ---------- */
  @media (max-width:719px){
    .top{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:10px;align-items:center}
    .eyebrow{display:none}
    h1{margin:0;font-size:25px}
    #tabs{flex-direction:row;gap:6px}
    #tabs>.qtabs{flex:1;min-width:0}
    #tabs:has(.ytabs[data-many]){flex-direction:column}

/* ===== 学年暦 ===== */
const toDate = v => typeof v === 'string' ? new Date(v + 'T00:00') : new Date(v.getFullYear(), v.getMonth(), v.getDate());
// その日の状態。class=授業日か、d=その日に行う授業の曜日（月=0）、kind=class|swap|holiday|cancel|weekend|vac|orient|gap、
// term=学期、exam=定期試験期間、events=その日にかかる行事・登録期間・休業
function dayInfo(v) {
  const dt = toDate(v), iso = isoDate(dt), wd = dt.getDay(), cal = CALENDARS[acadYear(dt)] || null;
  const r = { iso, wd, cal, class: false, d: -1, kind: 'class', label: '', swap: false, term: null, exam: null, events: [] };
  if (!cal) { r.class = wd >= 1 && wd <= 5; r.d = r.class ? wd - 1 : -1; r.kind = r.class ? 'class' : 'weekend'; r.label = r.class ? '' : '土日'; return r; }
  const term = cal.terms.find(t => t.s <= iso && iso <= t.e);
  r.term = term ? term.q : null;
  r.exam = cal.exams.find(x => x.s <= iso && iso <= x.e) || null;
  r.events = [...cal.events, ...cal.vacations.map(x => ({ ...x, kind: 'vac' }))].filter(x => x.s <= iso && iso <= x.e);
  const weekend = wd === 0 || wd === 6;
  if (cal.holidays[iso]) { r.kind = 'holiday'; r.label = cal.holidays[iso]; return r; }
  const vac = cal.vacations.find(x => x.s <= iso && iso <= x.e);              // 休業は学期の期間内（冬季休業）でも授業なし
  if (vac) { r.kind = 'vac'; r.label = vac.name; return r; }
  if (term) {
    if (cal.cancelled[iso]) { r.kind = 'cancel'; r.label = cal.cancelled[iso]; return r; }
    if (iso in cal.swaps) { r.class = true; r.d = cal.swaps[iso]; r.kind = 'swap'; r.swap = true; r.label = `${DAYS[r.d]}曜日の授業日`; return r; }
    if (weekend) { r.kind = 'weekend'; r.label = '土日'; return r; }
    r.class = true; r.d = wd - 1; return r;
  }
  const ori = cal.events.find(x => x.kind === 'orient' && x.s <= iso && iso <= x.e);
  if (ori) { r.kind = 'orient'; r.label = ori.name; return r; }
  r.kind = weekend ? 'weekend' : 'gap'; r.label = weekend ? '土日' : '授業期間外';
  return r;
}
// 科目が履修を終える学期（前期=2、後期・通年=4）の定期試験期間は、その科目の通常授業がない
const examWindow = c => {
  const cal = CALENDARS[c.year];
  return cal && c.quarters.length ? cal.exams.find(x => x.term === Math.max(...c.quarters)) || null : null;
};
const inExamFor = (c, iso) => { const w = examWindow(c); return !!w && w.s <= iso && iso <= w.e; };
const sessCache = new Map();
function calSessions(c) {
  const cal = CALENDARS[c.year];
  if (!cal) return 0;
  const key = `${c.year}|${c.quarters.join()}|${c.slots.map(x => x.d).sort().join()}`;
  if (sessCache.has(key)) return sessCache.get(key);
  let n = 0;
  for (const q of c.quarters) {
    const t = cal.terms.find(x => x.q === q);
    if (!t) continue;
    for (const dt = new Date(t.s + 'T00:00'); isoDate(dt) <= t.e; dt.setDate(dt.getDate() + 1)) {
      const i = dayInfo(dt);
      if (i.class && !inExamFor(c, i.iso)) n += c.slots.filter(x => x.d === i.d).length;
    }
  }
  sessCache.set(key, n);

}
const termLabel = qs => { const k = [...qs].sort().join(); return k === '1,2' ? '前期' : k === '3,4' ? '後期' : k === '1,2,3,4' ? '通年' : qs.map(q => 'Q' + q).join('·'); };
const calEvents = cal => [
  ...cal.events,
  ...cal.exams.map(x => ({ kind: 'exam', name: `第${x.term}学期定期試験`, s: x.s, e: x.e, note: x.note })),
  ...cal.vacations.map(x => ({ kind: 'vac', name: x.name, s: x.s, e: x.e })),

// 時間割画面の上に出す、今日の状態と直近の期間
function calBannerHTML() {
  const info = dayInfo(new Date()), cal = info.cal;

  const T = info.iso, days = x => Math.round((new Date(x + 'T00:00') - new Date(T + 'T00:00')) / 864e5);

    if (x.kind === 'vac' || x.kind === 'event') continue;
    const k = x.kind === 'exam' ? 'exam' : 'reg';
    if (x.s <= T && T <= x.e) out.push([k, `${x.name} ${fmtShort(x.s)}–${fmtShort(x.e)}（${days(x.e) === 0 ? '今日まで' : `あと${days(x.e)}日`}）`]);

    else if (i.kind === 'orient') out.push(['off', `${w} ${fmtShort(iso)}：${i.label}（授業なし）`]);

  return out.length ? `<div class="wnotes">${out.map(([k, t]) => `<div class="cbn ${k}">${esc(t)}</div>`).join('')}</div>` : '';

    <div class="fg"><span class="fl">クォーター期間（任意・毎年共通）</span>
      ${QUARTERS.map((q, i) => `<div class="qrange"><b>Q${q}</b><input type="date" data-i="${i}" data-k="s" value="${esc(r[i].s)}" aria-label="Q${q} 開始日"><span>〜</span><input type="date" data-i="${i}" data-k="e" value="${esc(r[i].e)}" aria-label="Q${q} 終了日"></div>`).join('')}
      <div class="hint">月日だけを使います（年は無視）。設定すると起動時に今のクォーターを自動で開き、NOW / NEXT に表示します。2026年度は内蔵の学年暦（祝日・休講・曜日振替・試験期間）を優先するので、この設定は学年暦のない年度で使われます。</div></div>
    <div class="dsec" style="margin-top:20px"><h4>${ICON.clock}時限</h4><div class="body num" style="font-family:var(--mono);font-size:13px">${PERIODS.map(P => `${P.n}限  ${P.s} – ${P.e}`).join('\n')}</div></div>
    <div class="divider"></div>
    <div class="fg"><span class="fl">データ</span><button class="btn danger" id="stWipe" style="width:100%">${ICON.trash}すべての授業を削除</button></div>
    <p class="about">データはこの端末のブラウザ（localStorage）にのみ保存されます。4年間使うので、学期ごとに「共有」からリンクかJSONで控えておくと安心です。</p>`;
  const foot = `<button class="btn" data-close>閉じる</button><span class="spacer"></span><button class="btn pri" id="stSave">保存</button>`;
  openSheet('設定', body, foot, sh => {
    const catsEl = $('#stCats', sh);
    $('#stCatAdd', sh).addEventListener('click', () => { catsEl.insertAdjacentHTML('beforeend', blk({ id: uid(), name: '', req: 0 })); $('.cblk:last-child .cn', catsEl).focus(); });
    catsEl.addEventListener('click', e => {
      const x = e.target.closest('.x');
      if (x) { const r = x.closest('.crow'); (r.classList.contains('top') ? r.closest('.cblk') : r).remove(); return; }
      const a = e.target.closest('[data-addkid]');
      if (a) { const b = a.closest('.cblk'); $('.ckids', b).insertAdjacentHTML('beforeend', crow({ id: uid(), name: '', req: 0 }, 'kid')); $('.ckids .crow:last-child .cn', b).focus(); }
    });
    armButton($('#stPreset', sh), '本当に初期設定へ戻す', () => {
      S.cats = presetCats(); S.required = DEFAULT_REQUIRED;
      save(); closeSheet(); render(); toast('卒業要件を初期設定（128単位）に戻しました');
    });
    $('#stPromo', sh).addEventListener('click', e => {
      const b = e.target.closest('.tg'); if (!b) return;
      $$('#stPromo .tg', sh).forEach(x => x.classList.toggle('on', x === b));
    });
    $('#stSave', sh).addEventListener('click', () => {
      const nr = QUARTERS.map(() => ({ s: '', e: '' }));
      $$('input[type=date]', sh).forEach(i => { nr[+i.dataset.i][i.dataset.k] = i.value; });
      const req = parseFloat($('#stReq', sh).value);
      if (!(req > 0)) { toast('卒業要件単位を正しく入力してください'); return; }
      S.ranges = nr;
      S.entryYear = +$('#stEntry', sh).value;
      S.entrySet = true;
      S.years = +$('#stYears', sh).value;
      S.required = req;
      S.promo = $('#stPromo .tg.on', sh).dataset.v !== '0';
      S.attRatio = +$('#stAtt', sh).value;
      S.lateRatio = +$('#stLate', sh).value;
      const oldName = new Map(S.cats.map(x => [x.id, x.name]));
      const next = [];
      $$('.cblk', catsEl).forEach(b => {
        const t = { id: b.dataset.id, name: $('.crow.top .cn', b).value.trim(), req: Math.max(0, parseFloat($('.crow.top .cr', b).value) || 0), parent: '' };
        if (!t.name) return;
        next.push(t);
        $$('.ckids .crow', b).forEach(r => { const name = $('.cn', r).value.trim(); if (name) next.push({ id: r.dataset.id, name, req: Math.max(0, parseFloat($('.cr', r).value) || 0), parent: t.id }); });
      });
      S.cats = normCats(next);
      S.cats.forEach(x => { const o = oldName.get(x.id); if (o && o !== x.name) state.courses.forEach(c => { if (c.category === o) c.category = x.name; }); });   // 区分名を変えたら授業の区分も追従させる
      const cq = quarterByDate();
      if (cq) state.ui.q = cq;
      save(); closeSheet(); render(); toast('設定を保存しました');
    });
    armButton($('#stWipe', sh), `${ICON.trash}もう一度押すと全削除`, () => {
      detachExams(state.courses.map(c => c.id));
      state.courses = [];
      save(); closeSheet(); render(); toast('すべての授業を削除しました');
    });
  });
}

/* ===== events ===== */
document.addEventListener('click', e => {
  if (e.target.closest('#sheet')) return;
  if (e.target.closest('#goSettings')) { openSettings(); return; }
  const at = e.target.closest('[data-att],[data-attundo]');
  if (at) {
    if (at.dataset.att) {
      const [type, id, p] = at.dataset.att.split('|');
      const c = state.courses.find(x => x.id === id);
      if (c) recordAbsence(c, type, isoDate(new Date()), +p);
    } else {
      const [id, date, p] = at.dataset.attundo.split('|');
      const c = state.courses.find(x => x.id === id);
      if (c) { c.absences = c.absences.filter(a => !(a.date === date && a.p === +p)); save(); toast('今日の記録を取り消しました'); }
    }
    render();
    return;
  }
  if (e.target.closest('[data-acctopen]')) { openShare(); return; }
  const pm = e.target.closest('[data-pmopen],[data-pmadd],[data-pmexam]');
  if (pm) {
    const d = pm.dataset;
    if (d.pmopen) openDetail(d.pmopen);
    else if (d.pmadd) {
      const [k, i, j] = d.pmadd.split('|');
      const it = k === 'must' ? PROMOTION.must[+i] : PROMOTION.pick.items[+i];
      openForm(null, null, { name: it.names ? it.names[+j || 0] : it.name, credits: it.names ? '' : String(it.cr), category: it.cat === '全学教育科目' ? it.cat : '' });
    } else openExamForm(null, { courseId: d.pmexam, title: '日経TEST', kind: 'その他' });
    return;
  }
  const tk = e.target.closest('[data-tk]');
  if (tk) { toggleTask(...tk.dataset.tk.split('|')); render(); return; }
  const xo = e.target.closest('[data-xopen],[data-xday],[data-xadd]');
  if (xo) {
    const d = xo.dataset;
    if (d.xopen) openExamDetail(d.xopen); else if (d.xday) openDay(d.xday); else openExamForm(null, { courseId: d.xadd });
    return;
  }
  const t = e.target.closest('[data-q],[data-y],[data-view],[data-filter],[data-goyear],[data-open],[data-add],[data-span],[data-dd],[data-day]');
  if (!t) return;
  const d = t.dataset;
  if (d.span) { state.ui.span = d.span; save(); render(); }
  else if (d.dd) { dayIdx = +d.dd; render(); }
  else if (d.day) { dayIdx = +d.day; state.ui.span = 'day'; save(); render(); }
  else if (d.q) { state.ui.q = +d.q; save(); render(); }
  else if (d.y) { state.ui.y = +d.y; save(); render(); }
  else if (d.view) { state.ui.view = d.view; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (d.filter) { state.ui.filter = d.filter; save(); render(); }
  else if (d.goyear) { state.ui.y = +d.goyear; state.ui.view = 'list'; state.ui.filter = 'year'; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (d.open) openDetail(d.open);
  else if (d.add !== undefined) {
    const [dd, p] = d.add.split('-').map(Number);
    openForm(null, d.add ? { d: dd, p } : null);
  }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'lsearch') return;
  search = e.target.value;
  $('#lres').innerHTML = listResultsHTML();
});
document.addEventListener('change', e => {
  if (e.target.id !== 'nkScore') return;
  const v = parseFloat(e.target.value);
  state.settings.nikkei = v >= 0 ? String(v) : '';
  save(); render(); toast('日経TESTのスコアを保存しました');
});
$('#btnAdd').addEventListener('click', () => state.ui.view === 'exam' ? openExamForm(null) : openForm(null));
$('#btnCal').addEventListener('click', () => openCalendar());
$('#btnShare').addEventListener('click', openShare);
$('#btnSettings').addEventListener('click', openSettings);
window.addEventListener('hashchange', checkHash);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#sheet').classList.contains('open') && document.activeElement.id !== 'lsearch') render(); });
setInterval(() => {
  if (document.hidden || $('#sheet').classList.contains('open')) return;
  if (state.ui.view === 'grid') { renderNow(); $('#view').innerHTML = timetableHTML(false); }
  else if (state.ui.view === 'list' && state.ui.filter === 'term') renderNow();
}, 30000);

/* ===== phone gestures ===== */
// 左右スワイプ：週間・一覧は前後のクォーター、1日表示は前後の曜日。画面端は iOS の戻る/進むに譲る
let swp = null;
document.addEventListener('touchstart', e => {
  swp = null;
  if (e.touches.length !== 1 || document.body.classList.contains('lock')) return;
  const t = e.touches[0];
  if (t.clientX < 28 || t.clientX > innerWidth - 28) return;
  if (e.target.closest('.strip,input,textarea,select,.bar,details')) return;
  swp = { x: t.clientX, y: t.clientY, t: Date.now() };
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!swp) return;
  const t = e.changedTouches[0], dx = t.clientX - swp.x, dy = t.clientY - swp.y, s = swp;
  swp = null;
  if (Math.abs(dx) < 64 || Math.abs(dx) < Math.abs(dy) * 1.8 || Date.now() - s.t > 700) return;
  const dir = dx < 0 ? 1 : -1, { view, filter, span } = state.ui;
  if (view === 'grid' && span === 'day') {
    const n = dayIdx + dir;
    if (n >= 0 && n <= 4) { dayIdx = n; render(); }
  } else if (view === 'grid' || (view === 'list' && filter === 'term')) {
    const n = state.ui.q + dir;
    if (n >= 1 && n <= 4) { state.ui.q = n; save(); render(); }
  }
}, { passive: true });

// ボトムシートを見出しから下へ引いて閉じる
{
  const sh = $('#sheet');
  let drag = null;
  sh.addEventListener('touchstart', e => {
    if (matchMedia('(min-width:720px)').matches || !e.target.closest('.grab,.sh-head')) return;
    drag = { y: e.touches[0].clientY, dy: 0 };
  }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (!drag) return;
    drag.dy = Math.max(0, e.touches[0].clientY - drag.y);
    if (drag.dy > 6) { sh.style.transition = 'none'; sh.style.transform = `translateY(${drag.dy}px)`; }
  }, { passive: true });
  const end = () => {
    if (!drag) return;
    const dy = drag.dy;
    drag = null;
    if (dy > 110) closeSheet();      // 閉じた時点で visibility:hidden になるので、戻し処理を挟んでも跳ねて見えない
    sh.style.transition = ''; sh.style.transform = '';
  };
  sh.addEventListener('touchend', end);
  sh.addEventListener('touchcancel', end);
}

// ソフトキーボードが出たら、シートの底（保存ボタン）をキーボードの上に持ち上げる
if (window.visualViewport) {
  const vv = window.visualViewport, sh = $('#sheet');
  const fit = () => {
    const kb = Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop));
    if (kb > 80 && !matchMedia('(min-width:720px)').matches) { sh.style.bottom = kb + 'px'; sh.style.maxHeight = Math.round(vv.height * .94) + 'px'; }
    else { sh.style.bottom = ''; sh.style.maxHeight = ''; }
  };
  vv.addEventListener('resize', fit);
  vv.addEventListener('scroll', fit);
}
document.addEventListener('focusin', e => {
  if (e.target.matches('input,textarea,select') && e.target.closest('.sh-body')) setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 350);
});

/* ===== boot ===== */
{
  if (session && !sync.sig) { sync.sig = payloadSig(); persistSync(); }
  bootUI();
  render();
  (async () => {
    const back = await consumeAuthHash();                  // 再設定・確認メールのリンクから戻ってきたとき
    if (!back) await checkHash();                          // 共有リンク
    else { render(); openShare(); }
    startSyncWatch();
    if (session) syncNow(false);
  })();
}
</script>
</body>
</html>
